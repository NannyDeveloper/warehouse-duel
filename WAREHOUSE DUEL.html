<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>WAREHOUSE DUEL</title>
<style>
:root{--ink:#ecebe6;--panel:rgba(16,18,20,.86);--hz:#f2c200;--red:#e5412d;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#ecebe6;--panel:rgba(16,18,20,.86)}}
:root[data-theme="dark"]{--ink:#ecebe6;--panel:rgba(16,18,20,.86)}
html,body{margin:0;height:100%;overflow:hidden;background:#101214;color:var(--ink);font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;font-weight:600;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0}
body>canvas{filter:saturate(.82) contrast(1.06)}
#vig{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--panel);z-index:10;text-align:center;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
.ov.hide{display:none}
h1{font-size:clamp(34px,9vw,72px);letter-spacing:.14em;margin:0 0 6px;font-weight:800;color:var(--hz);text-shadow:0 2px 12px #000}
.stripe{width:min(360px,70vw);height:10px;margin-bottom:18px;background:repeating-linear-gradient(135deg,var(--hz) 0 14px,#16181a 14px 28px)}
button{font:inherit;font-size:20px;letter-spacing:.06em;padding:12px 30px;min-width:230px;border:2px solid var(--hz);background:#16181a;color:var(--ink);cursor:pointer}
button:hover,button:active{background:var(--hz);color:#111}
#sets{display:none;flex-direction:column;gap:8px;align-items:center}
#sets input{width:220px;accent-color:var(--hz)}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none;text-shadow:0 1px 4px #000}
#hurt{position:absolute;inset:0;box-shadow:inset 0 0 120px 30px var(--red);opacity:0}
#score{position:absolute;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:24px;font-weight:700;letter-spacing:.08em;background:rgba(0,0,0,.45);padding:4px 16px}
#cross{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:#fff;box-shadow:0 0 3px #000}
#cross.hit{background:var(--red);transform:scale(2.4)}
#hp{position:absolute;left:20px;bottom:calc(20px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;font-size:34px}
#hpbar{position:relative;width:200px;height:16px;background:rgba(0,0,0,.55);border:2px solid #000}#hpbar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 14px,#000 14px 16px)}
#hpfill{display:block;height:100%;width:100%;background:#7ddc4c}
#ammo{position:absolute;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));font-size:38px;text-align:right}
#ammo span{font-size:24px;opacity:.7}
#rl{font-size:16px;color:var(--hz);height:18px}
#mini{position:absolute;left:calc(14px + env(safe-area-inset-left));top:calc(14px + env(safe-area-inset-top));width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(30,34,38,.55)}
#timer{position:absolute;top:calc(48px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:20px;opacity:.85}
</style>
</head>
<body>

<div id="menu" class="ov">
  <h1>WAREHOUSE DUEL</h1><div class="stripe"></div>
  <button id="bPlay">Играть</button>
  <button id="bSet">Настройки</button>
  <div id="sets"><label for="vol">Громкость</label><input id="vol" type="range" min="0" max="100" value="50"></div>
  <button id="bExit">Выход</button>
  <div id="menuMsg" style="max-width:520px;opacity:.7;font-size:14px;line-height:1.5;margin-top:10px">WASD — движение, мышь — обзор, ЛКМ — огонь, ПКМ — прицел, R — перезарядка, Shift — бег, Space — прыжок</div>
</div>

<div id="death" class="ov hide"><h1>Ты убит</h1><button id="respBtn">Возродиться (3)</button></div>
<div id="end" class="ov hide"><h1 id="endTitle">Победа!</h1><div id="endScore"></div><button id="menuBtn">В меню</button></div>

<div id="vig"></div>
<div id="hud">
  <div id="hurt"></div>
  <canvas id="mini" width="120" height="120"></canvas>
  <div id="score">Ты: 0 | Боты: 0</div><div id="timer">3:00</div>
  <div id="cross"></div>
  <div id="hp"><div id="hpbar"><i id="hpfill"></i></div><b id="hpnum">100</b></div>
  <div id="ammo"><b id="am">30</b><span>/<span id="rs">90</span></span><div id="rl"></div></div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===================== КОНСТАНТЫ И СОСТОЯНИЕ =====================
const $ = id => document.getElementById(id);
const HALF = 30;          // половина арены (60x60)
const WIN = 10;           // фрагов до победы
const MAG = 30;           // размер магазина

let scene, camera, renderer, clock, gun, flash, muzzle;
let state = 'menu';       // menu | play | paused | ended
let botFrags = 0, hurtA = 0, vol = 0.5, actx, master;
const crates = [], crateMeshes = [], wallMeshes = [], bots = [];
const keys = {};
const rc = new THREE.Raycaster();

// Состояние игрока
const P = {
  pos: new THREE.Vector3(0, 1.7, 14), vy: 0, yaw: 0, pitch: 0,
  hp: 100, dead: false, respT: 0, frags: 0,
  ammo: MAG, reserve: 90, reloading: false, reloadT: 0,
  last: 0, firing: false, aim: false, jumpReq: false, kick: 0, flashT: 0
};

// ===================== ИНИЦИАЛИЗАЦИЯ =====================
function init() {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setSize(innerWidth, innerHeight);
  document.body.prepend(renderer.domElement);
  camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.05, 200);
  camera.rotation.order = 'YXZ';
  clock = new THREE.Clock();
  setupScene();
  for (let i = 0; i < 4; i++) makeBot();
  bindInput();
  bindUI();
  
  addEventListener('resize', () => {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  });
  camera.position.copy(P.pos);
  loop();
}

// ===================== СЦЕНА (контейнерный двор) =====================
let matchT = 180;   // таймер матча, сек

// Канвас-текстура с повтором
function mkTex(w, h, draw, rx, ry) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 8; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx || 1, ry || 1);
  return t;
}
// Грязь и потёртости
function speckle(g, w, h, n, a) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = 'rgba(' + (Math.random() < 0.5 ? '0,0,0,' : '255,255,255,') + Math.random() * a + ')';
    g.fillRect(Math.random() * w, Math.random() * h, 2 + Math.random() * 6, 2 + Math.random() * 6);
  }
}
// Морской контейнер 2.6 м высотой: рёбра, потёртости, номер на борту
function addContainer(x, z, w, d, col) {
  const tile = mkTex(128, 128, (g, W, H) => {
    g.fillStyle = col; g.fillRect(0, 0, W, H);
    for (let i = 0; i < W; i += 16) { g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(i, 0, 5, H); g.fillStyle = 'rgba(255,255,255,.1)'; g.fillRect(i + 5, 0, 2, H); }
    speckle(g, W, H, 400, 0.3);
    for (let i = 0; i < 7; i++) { g.fillStyle = 'rgba(110,55,20,.22)'; g.fillRect(Math.random() * W, 0, 3 + Math.random() * 7, H * (0.2 + Math.random() * 0.7)); }   // потёки ржавчины
  });
  const side = tile.clone(); side.needsUpdate = true; side.repeat.set(Math.max(w, d) / 2.6, 1);
  const mk = t => new THREE.MeshStandardMaterial({ map: t, bumpMap: t, bumpScale: 1.5, roughness: 0.7, metalness: 0.3 });
  const A = mk(tile), B = mk(side);
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, 2.6, d), d > w ? [B, B, A, A, A, A] : [A, A, A, A, B, B]);
  m.position.set(x, 1.3, z); m.castShadow = m.receiveShadow = true; scene.add(m); crateMeshes.push(m);
  crates.push({ x, z, hx: w / 2, hz: d / 2 });
  const id = Array.from({ length: 4 }, () => String.fromCharCode(65 + Math.random() * 26 | 0)).join('') + ' ' + (100 + Math.random() * 899 | 0) + ' ' + (Math.random() * 10 | 0) + '-' + (Math.random() * 10 | 0);
  const lab = mkTex(256, 64, g => { g.fillStyle = 'rgba(235,235,225,.85)'; g.font = 'bold 34px Arial'; g.fillText(id, 10, 44); }, 1, 1, true);
  const dec = new THREE.Mesh(new THREE.PlaneGeometry(3, 0.75), new THREE.MeshLambertMaterial({ map: lab, transparent: true }));
  if (d > w) { dec.position.set(x + w / 2 + 0.02, 2, z - d / 4); dec.rotation.y = Math.PI / 2; }
  else { dec.position.set(x - w / 4, 2, z + d / 2 + 0.02); }
  scene.add(dec);
}
// Деревянный ящик 3x3x3
function addCrate(x, z, wood) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 3), wood);
  m.position.set(x, 1.5, z); m.castShadow = m.receiveShadow = true; scene.add(m); crateMeshes.push(m);
  crates.push({ x, z, hx: 1.5, hz: 1.5 });
}

function setupScene() {
  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xbcc0c3, 28, 110);       // серая дымка пасмурного дня
  scene.add(new THREE.HemisphereLight(0xe4e8ec, 0x4a4e52, 0.35));
  const sun = new THREE.DirectionalLight(0xfff2dc, 1.3); sun.position.set(-22, 24, -14);   // низкое солнце — длинные тени
  sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
  const sc = sun.shadow.camera; sc.left = sc.bottom = -42; sc.right = sc.top = 42; sc.near = 1; sc.far = 90; sun.shadow.bias = -0.0005;
  scene.add(sun);

  // Пасмурное небо (градиентный купол)
  const skyT = mkTex(16, 256, (g, W, H) => {
    const gr = g.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, '#6a7178'); gr.addColorStop(0.5, '#c3c6c8'); gr.addColorStop(1, '#c3c6c8');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  }, 1, 1, true);
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(150, 16, 12), new THREE.MeshBasicMaterial({ map: skyT, side: THREE.BackSide, fog: false, toneMapped: false })));
  // Карта окружения из того же неба: отражения на металле и реалистичный рассеянный свет
  const envScene = new THREE.Scene();
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 16, 12), new THREE.MeshBasicMaterial({ map: skyT, side: THREE.BackSide })));
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(envScene).texture;

  // Асфальт + земля за забором + жёлтая разметка
  const asph = mkTex(256, 256, (g, W, H) => {
    g.fillStyle = '#585f66'; g.fillRect(0, 0, W, H); speckle(g, W, H, 1500, 0.22);
    g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 1.2;
    for (let i = 0; i < 6; i++) { g.beginPath(); let x = Math.random() * W, y = Math.random() * H; g.moveTo(x, y); for (let k = 0; k < 8; k++) { x += (Math.random() - 0.5) * 50; y += (Math.random() - 0.5) * 50; g.lineTo(x, y); } g.stroke(); }
    for (let i = 0; i < 4; i++) { g.fillStyle = 'rgba(15,18,22,.25)'; g.beginPath(); g.ellipse(Math.random() * W, Math.random() * H, 20 + Math.random() * 30, 10 + Math.random() * 18, Math.random() * 3, 0, 7); g.fill(); }
  }, 12, 12);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(HALF * 2, HALF * 2), new THREE.MeshStandardMaterial({ map: asph, bumpMap: asph, bumpScale: 0.8, roughness: 0.95, metalness: 0 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  const out = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({ color: 0x4b5056 }));
  out.rotation.x = -Math.PI / 2; out.position.y = -0.03; scene.add(out);
  [-7, 7].forEach(x => {
    const l = new THREE.Mesh(new THREE.PlaneGeometry(0.25, HALF * 2 - 2), new THREE.MeshBasicMaterial({ color: 0xc9a400 }));
    l.rotation.x = -Math.PI / 2; l.position.set(x, 0.02, 0); scene.add(l);
  });

  // Сетчатый забор по периметру (пули его не пробивают)
  const fenceT = mkTex(32, 32, g => {
    g.strokeStyle = 'rgba(175,180,186,.95)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, 0); g.lineTo(32, 32); g.moveTo(0, 32); g.lineTo(32, 0); g.stroke();
  }, HALF * 2, 4, true);
  const fm = new THREE.MeshLambertMaterial({ map: fenceT, alphaTest: 0.4, side: THREE.DoubleSide });
  [[0, -HALF, 0], [0, HALF, 0], [-HALF, 0, 1], [HALF, 0, 1]].forEach(([x, z, r]) => {
    const w = new THREE.Mesh(new THREE.PlaneGeometry(HALF * 2, 4), fm);
    w.position.set(x, 2, z); w.rotation.y = r * Math.PI / 2; scene.add(w); wallMeshes.push(w);
  });

  // Контейнеры (x, z, ширина, длина, цвет)
  const C = { r: '#8e2f26', g: '#5f7d3c', b: '#35567e', s: '#a3a39c', y: '#c9a02c' };
  [[-14, -14, 2.6, 12, C.r], [-2, -18, 12, 2.6, C.g], [14, -14, 2.6, 12, C.b],
   [-20, 2, 12, 2.6, C.s], [0, -4, 2.6, 12, C.y], [20, 2, 12, 2.6, C.r],
   [-14, 16, 2.6, 12, C.b], [2, 18, 12, 2.6, C.s], [16, 14, 2.6, 12, C.g]
  ].forEach(a => addContainer(...a));

  // Деревянные ящики
  const wood = new THREE.MeshStandardMaterial({ roughness: 0.85, map: mkTex(128, 128, (g, W, H) => {
    g.fillStyle = '#8a5a2b'; g.fillRect(0, 0, W, H);
    for (let y = 0; y < H; y += 32) { g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, y, W, 3); }
    g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(0, 0, 10, H); g.fillRect(W - 10, 0, 10, H);
    speckle(g, W, H, 160, 0.25);
  }) });
  [[-6, 8], [8, 6], [-4, -10], [8, -6], [-8, -4], [24, -6], [-24, -8], [-24, 20]].forEach(([x, z]) => addCrate(x, z, wood));

  // Антураж: бочки и здания за забором
  const L = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.65, metalness: 0.15 });
  [[-8, 14, 0x8e2f26], [-6.8, 15.2, 0x35567e], [24, 10, 0x8e2f26], [25.2, 11, 0x5f7d3c], [5, -12, 0x35567e], [-18, -6, 0x8e2f26]].forEach(([x, z, c]) => {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1.1, 14), L(c));
    m.position.set(x, 0.55, z); m.castShadow = m.receiveShadow = true; scene.add(m); crateMeshes.push(m); crates.push({ x, z, hx: 0.5, hz: 0.5 });
  });
  [[0, -52, 40, 10, 14], [-48, -10, 12, 34, 10], [50, 10, 12, 30, 12], [10, 55, 36, 10, 9]].forEach(([x, z, w, d, h], i) => {
    const wt = mkTex(128, 64, (g, W, H) => {   // фасад с окнами
      g.fillStyle = i % 2 ? '#8f949a' : '#a39b8c'; g.fillRect(0, 0, W, H); g.fillStyle = 'rgba(30,40,50,.75)';
      for (let X = 8; X < W; X += 24) for (let Y = 10; Y < H; Y += 26) g.fillRect(X, Y, 14, 14);
      speckle(g, W, H, 200, 0.15);
    }, w / 6, h / 6);
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ map: wt, roughness: 0.9 })); b.position.set(x, h / 2, z); scene.add(b);
  });

  // Бетонные блоки (укрытия), покрышка и фонари за забором
  const conc = new THREE.MeshStandardMaterial({ map: mkTex(64, 64, (g, W, H) => { g.fillStyle = '#8c8f92'; g.fillRect(0, 0, W, H); speckle(g, W, H, 300, 0.3); }), roughness: 1 });
  [[10, -1, 3, 0.8], [-10, 6, 0.8, 3], [-3, 12, 3, 0.8], [26, -14, 0.8, 3]].forEach(([x, z, w, d]) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, 1.1, d), conc); m.position.set(x, 0.55, z); m.castShadow = m.receiveShadow = true;
    scene.add(m); crateMeshes.push(m); crates.push({ x, z, hx: w / 2, hz: d / 2 });
  });
  const tire = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.17, 8, 16), L(0x111214)); tire.position.set(-4, 0.2, 4); tire.rotation.x = Math.PI / 2; tire.castShadow = true; scene.add(tire);
  [[-HALF - 2, -HALF - 2], [HALF + 2, -HALF - 2], [-HALF - 2, HALF + 2], [HALF + 2, HALF + 2]].forEach(([x, z]) => {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 9, 8), L(0x33363a)); pole.position.set(x, 4.5, z); pole.castShadow = true; scene.add(pole);
  });

  // Карабин от первого лица: коллиматор, цевьё, магазин, руки в перчатках
  scene.add(camera);
  const dm = L(0x2a2d30), gr = L(0x4a4f54), sl = L(0x56603f), gl = L(0x15171a);
  gun = new THREE.Group();
  const part = (w, h, d, m, x, y, z, rx, ry) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); o.rotation.set(rx || 0, ry || 0, 0); gun.add(o); return o; };
  part(0.08, 0.12, 0.5, dm, 0, 0, 0);               // ресивер
  part(0.07, 0.08, 0.32, gr, 0, -0.01, -0.38);      // цевьё
  part(0.03, 0.03, 0.3, dm, 0, 0.01, -0.67);        // ствол
  part(0.05, 0.03, 0.4, dm, 0, 0.075, -0.1);        // планка
  part(0.06, 0.07, 0.12, dm, 0, 0.12, -0.08);       // коллиматор
  part(0.06, 0.18, 0.1, dm, 0, -0.14, -0.02, 0.25); // магазин
  part(0.05, 0.1, 0.06, dm, 0, -0.1, 0.14, -0.3);   // рукоять
  part(0.07, 0.12, 0.26, gr, 0, -0.02, 0.36);       // приклад
  part(0.1, 0.1, 0.12, gl, -0.01, -0.07, -0.36);    // левая перчатка
  part(0.1, 0.1, 0.8, sl, -0.14, -0.14, 0.1, 0.15, -0.27);   // левый рукав
  part(0.09, 0.09, 0.1, gl, 0, -0.13, 0.14);        // правая перчатка
  part(0.1, 0.1, 0.55, sl, 0.1, -0.2, 0.4, 0.35);   // правый рукав
  flash = part(0.14, 0.14, 0.1, new THREE.MeshBasicMaterial({ color: 0xffd24a }), 0, 0.01, -0.85);
  flash.visible = false;
  muzzle = new THREE.PointLight(0xffb060, 0, 14); muzzle.position.set(0, 0.02, -0.9); gun.add(muzzle);   // свет вспышки
  gun.position.set(0.25, -0.22, -0.5);
  camera.add(gun);
}

// Солдат: камуфляж, разгрузка, каска с очками, винтовка. Хитбокс 1x2x1 невидим.
function buildSoldier(b, hit) {
  hit.rotation.order = 'YXZ';   // чтобы труп падал назад относительно направления взгляда
  const camo = mkTex(128, 128, (g, W, H) => {
    g.fillStyle = '#4f5a3a'; g.fillRect(0, 0, W, H);
    ['#6b7447', '#2f3824', '#8a8a62'].forEach(c => { g.fillStyle = c; for (let i = 0; i < 26; i++) { g.beginPath(); g.ellipse(Math.random() * W, Math.random() * H, 6 + Math.random() * 16, 4 + Math.random() * 10, Math.random() * 3, 0, 7); g.fill(); } });
  });
  const S = (c, r, m) => new THREE.MeshStandardMaterial({ color: c, roughness: r === undefined ? 0.85 : r, metalness: m || 0 });
  const cam = new THREE.MeshStandardMaterial({ map: camo, roughness: 0.9 });
  const dark = S(0x1d2024), vest = S(0x2c3034), skin = S(0xc29a78), met = S(0x151617, 0.4, 0.7), band = S(0xb02a20);
  const g = new THREE.Group(); g.position.y = -1; hit.add(g);   // низ фигуры = пол
  const add = (geo, m, x, y, z, par, rx) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); if (rx) o.rotation.x = rx; o.castShadow = true; (par || g).add(o); return o; };

// Кубики-«осколки» при попадании и убийстве
const parts = [];

    m.position.copy(p); m.userData.v = new THREE.Vector3((Math.random() - 0.5) * 5, Math.random() * 5, (Math.random() - 0.5) * 5); m.userData.t = 1;

  }
}
function updateParts(dt) {

    const m = parts[i], v = m.userData.v;
    v.y -= 14 * dt; m.position.addScaledVector(v, dt);
    if (m.position.y < 0.1) { m.position.y = 0.1; v.multiplyScalar(0.3); }
    m.rotation.x += dt * 6;

// Трассер пули и искра попадания

  scene.add(l); setTimeout(() => { scene.remove(l); g.dispose(); l.material.dispose(); }, 60);
}
const decals = [];
function impact(p, n) {   // искра + тёмная выбоина на поверхности
  const s = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.05), new THREE.MeshBasicMaterial({ color: 0xffd9a0 }));
  s.position.copy(p); scene.add(s); setTimeout(() => { scene.remove(s); s.geometry.dispose(); }, 80);
  if (!n) return;
  const d = new THREE.Mesh(new THREE.CircleGeometry(0.07, 8), new THREE.MeshBasicMaterial({ color: 0x0c0c0c, transparent: true, opacity: 0.7 }));
  d.position.copy(p).addScaledVector(n, 0.012); d.lookAt(p.clone().add(n)); scene.add(d); decals.push(d);

}

// Мини-карта: вращается вместе с игроком, красные точки — боты, заметившие тебя
function drawMinimap() {
  const g = $('mini').getContext('2d'), S = 1.7, R = 60;
  g.clearRect(0, 0, 120, 120); g.save(); g.translate(R, R); g.rotate(P.yaw);
  g.fillStyle = 'rgba(150,160,168,.85)';

// Таймер матча: по истечении побеждает тот, у кого больше фрагов
function tickMatch(dt) {

// ===================== ЗВУК (синтез через AudioContext) =====================
function audio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.connect(actx.destination); startWind();
  }
  master.gain.value = vol;
  if (actx.state === 'suspended') actx.resume();
}
function startWind() {   // фоновый ветер (фильтрованный шум)
  const n = actx.sampleRate * 3 | 0, buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
  let l = 0; for (let i = 0; i < n; i++) { l += (Math.random() * 2 - 1 - l) * 0.02; d[i] = l * 3; }
  const src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 500;
  const g = actx.createGain(); g.gain.value = 0.18; src.connect(f); f.connect(g); g.connect(master); src.start();
}
function noise(dur, freq, g) {
  const n = actx.sampleRate * dur | 0, b = actx.createBuffer(1, n, actx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = actx.createBufferSource(); s.buffer = b;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const gn = actx.createGain(); gn.gain.value = g;
  s.connect(f); f.connect(gn); gn.connect(master); s.start();
}
function tone(f0, f1, dur, g, type) {
  const t = actx.currentTime, o = actx.createOscillator(), gn = actx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  gn.gain.setValueAtTime(g, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(gn); gn.connect(master); o.start(); o.stop(t + dur);
}
const sfx = {
  step() { if (!actx) return; noise(0.07, 450, 0.22); },
  shot()  { if (!actx) return; noise(0.12, 2600, 0.8); tone(160, 40, 0.12, 0.6, 'square'); },
  bot(v)  { if (!actx || v <= 0) return; noise(0.1, 1500, 0.3 * v); },
  hit(h)  { if (!actx) return; tone(h ? 1500 : 800, h ? 2200 : 1100, 0.09, 0.4, 'sine'); },
  hurt()  { if (!actx) return; tone(220, 90, 0.15, 0.4, 'sawtooth'); },
  reload() {
    if (!actx) return;
    [0, 450, 1300].forEach(ms => setTimeout(() => { if (actx) { noise(0.04, 5000, 0.5); tone(400, 200, 0.05, 0.3, 'square'); } }, ms));
  }
};

// ===================== КОЛЛИЗИИ =====================
// Выталкивает круг радиуса r из стен арены и ящиков (в плоскости XZ)
function collide(p, r) {
  p.x = Math.max(-HALF + r, Math.min(HALF - r, p.x));
  p.z = Math.max(-HALF + r, Math.min(HALF - r, p.z));
  for (const c of crates) {
    const nx = Math.max(c.x - c.hx, Math.min(c.x + c.hx, p.x));
    const nz = Math.max(c.z - c.hz, Math.min(c.z + c.hz, p.z));
    const dx = p.x - nx, dz = p.z - nz, d = Math.hypot(dx, dz);
    if (d < r) {
      if (d > 1e-4) { p.x += dx / d * (r - d); p.z += dz / d * (r - d); }
      else {
        const ox = c.hx - Math.abs(p.x - c.x), oz = c.hz - Math.abs(p.z - c.z);
        if (ox < oz) p.x += (p.x >= c.x ? 1 : -1) * (ox + r);
        else p.z += (p.z >= c.z ? 1 : -1) * (oz + r);
      }
    }
  }
}
// Случайная точка арены вне ящиков (и подальше от заданной точки)
function randomPoint(away, minD) {
  for (let i = 0; i < 60; i++) {
    const x = (Math.random() * 2 - 1) * (HALF - 2), z = (Math.random() * 2 - 1) * (HALF - 2);
    if (crates.some(c => Math.abs(x - c.x) < c.hx + 1.2 && Math.abs(z - c.z) < c.hz + 1.2)) continue;
    if (away && Math.hypot(x - away.x, z - away.z) < minD) continue;
    return { x, z };
  }
  return { x: 0, z: -17 };
}

// ===================== ИГРОК =====================
function updatePlayer(dt) {
  if (P.dead) {                       // таймер респавна
    P.respT -= dt;
    $('respBtn').textContent = 'Возродиться (' + Math.max(0, Math.ceil(P.respT)) + ')';
    if (P.respT <= 0) respawnPlayer();
    camera.position.y = Math.max(0.35, camera.position.y - dt * 2);
    return;
  }
  // Движение
  const run = keys.ShiftLeft || keys.ShiftRight;
  const sp = run ? 8 : 5;
  let fx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
  let fz = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0);
  const l = Math.hypot(fx, fz); if (l > 1) { fx /= l; fz /= l; }
  const s = Math.sin(P.yaw), c = Math.cos(P.yaw);
  P.pos.x += (fx * c + fz * s) * sp * dt;
  P.pos.z += (-fx * s + fz * c) * sp * dt;
  collide(P.pos, 0.4);
  // Прыжок
  if ((keys.Space || P.jumpReq) && P.pos.y <= 1.701) P.vy = 7;
  P.vy -= 20 * dt; P.pos.y += P.vy * dt;
  if (P.pos.y < 1.7) { P.pos.y = 1.7; P.vy = 0; }
  // Прицеливание: FOV сужается
  const tf = P.aim ? 42 : 75;
  if (Math.abs(camera.fov - tf) > 0.1) { camera.fov += (tf - camera.fov) * Math.min(1, dt * 14); camera.updateProjectionMatrix(); }
  // Перезарядка
  if (P.reloading) {
    P.reloadT -= dt;
    if (P.reloadT <= 0) {
      const take = Math.min(MAG - P.ammo, P.reserve);
      P.ammo += take; P.reserve -= take; P.reloading = false; updateHUD();
    }
  }
  if (P.firing) shoot();
  // Камера и оружие
  camera.position.copy(P.pos); camera.position.y += Math.sin(P.bob || 0) * 0.02;
  camera.rotation.set(P.pitch, P.yaw, 0);
  P.kick *= Math.max(0, 1 - dt * 14);
  P.bob = (P.bob || 0) + (Math.hypot(fx, fz) > 0.1 && P.pos.y < 1.71 ? dt * (run ? 14 : 10) : 0);   // покачивание при ходьбе
  const stp = Math.floor(P.bob / Math.PI); if (stp !== P.stepN) { P.stepN = stp; if (P.bob > 0) sfx.step(); }   // шаги
  const bs = P.aim ? 0.3 : 1;
  gun.position.set((P.aim ? 0.0 : 0.25) + Math.sin(P.bob) * 0.012 * bs, (P.aim ? -0.17 : -0.22) + Math.abs(Math.cos(P.bob)) * 0.014 * bs, -0.5 + P.kick);
  P.swY = (P.swY || 0) * Math.max(0, 1 - dt * 8); P.swX = (P.swX || 0) * Math.max(0, 1 - dt * 8);
  gun.rotation.y = Math.max(-0.12, Math.min(0.12, P.swY));
  gun.rotation.x = (P.reloading ? -0.6 : 0) + Math.max(-0.12, Math.min(0.12, P.swX));
  if (P.flashT > 0) { P.flashT -= dt; if (P.flashT <= 0) flash.visible = false; }
  muzzle.intensity *= Math.max(0, 1 - dt * 30);
  hurtA = Math.max(0, hurtA - dt * 1.5); $('hurt').style.opacity = hurtA;
}

function shoot() {
  const now = performance.now() / 1000;
  if (P.dead || P.reloading || now - P.last < 0.1) return;   // автомат: 10 выстрелов/сек
  if (P.ammo <= 0) { reload(); return; }
  P.last = now; P.ammo--;
  sfx.shot();
  // Отдача: ствол вверх + лёгкий увод в сторону
  P.pitch = Math.min(1.5, P.pitch + 0.014); P.yaw += (Math.random() - 0.5) * 0.006;
  P.kick = 0.07; flash.visible = true; P.flashT = 0.04; muzzle.intensity = 3;
  // Raycaster из центра экрана
  camera.updateMatrixWorld();
  rc.setFromCamera({ x: 0, y: 0 }, camera); rc.far = 100;
  const targets = crateMeshes.concat(wallMeshes, bots.filter(b => !b.dead).map(b => b.mesh));
  const hit = rc.intersectObjects(targets, false)[0];
  tracer(camera.localToWorld(new THREE.Vector3(0.2, -0.18, -0.9)), hit ? hit.point : rc.ray.at(60, new THREE.Vector3()), 0xffe08a);
  if (hit && hit.object.userData.bot) {
    const localY = hit.point.y - (hit.object.position.y - 1);   // высота точки над полом бота
    damageBot(hit.object.userData.bot, localY >= 4 / 3);
  } else if (hit) { impact(hit.point, hit.face ? hit.face.normal.clone().transformDirection(hit.object.matrixWorld) : null); }
  updateHUD();
  if (P.ammo === 0) reload();
}

function reload() {
  if (P.reloading || P.dead || P.ammo >= MAG || P.reserve <= 0) return;
  P.reloading = true; P.reloadT = 1.5; sfx.reload(); updateHUD();
}

function hurtPlayer(d) {
  if (P.dead) return;
  P.hp = Math.max(0, P.hp - d); hurtA = 0.7; sfx.hurt(); updateHUD();
  if (P.hp <= 0) {
    P.dead = true; P.respT = 3; P.firing = false; botFrags++; updateScore();
    if (botFrags >= WIN) { endGame(false); return; }
    $('death').classList.remove('hide');
    document.exitPointerLock && document.exitPointerLock();   // чтобы можно было нажать кнопку
  }
}

function respawnPlayer() {
  const alive = bots.find(b => !b.dead);
  const p = randomPoint(alive ? alive.mesh.position : null, 10);
  P.pos.set(p.x, 1.7, p.z); P.vy = 0; P.pitch = 0; P.yaw = Math.random() * 6.28;
  P.hp = 100; P.ammo = MAG; P.reserve = 90; P.reloading = false; P.dead = false;
  $('death').classList.add('hide'); updateHUD();
  if (state === 'play') { try { renderer.domElement.requestPointerLock(); } catch (e) {} }
}

// ===================== БОТЫ =====================
function makeBot() {
  const m = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshBasicMaterial({ visible: false }));   // невидимый хитбокс 1x2x1
  const b = { mesh: m, hp: 100, dead: false, state: 'patrol', target: null, react: 0, shootT: 0, hideT: 0, coverCd: 0, respT: 0, stuck: 0, sees: false, cover: null };
  m.userData.bot = b; buildSoldier(b, m); scene.add(m); bots.push(b);
  placeBot(b);
}
function placeBot(b) {
  const p = randomPoint(P.pos, 10);
  b.mesh.position.set(p.x, 1, p.z); b.mesh.rotation.set(0, 0, 0); b.mesh.visible = true;
  b.hp = 100; b.dead = false; b.state = 'patrol'; b.sees = false; b.coverCd = 0;
  pickTarget(b);
}
function pickTarget(b) { b.target = randomPoint(); b.stuck = 0; }

function nearestCrate(p) {
  let best = crates[0], bd = 1e9;
  for (const c of crates) { const d = Math.hypot(Math.max(Math.abs(p.x - c.x) - c.hx, 0), Math.max(Math.abs(p.z - c.z) - c.hz, 0)); if (d < bd) { bd = d; best = c; } }
  return best;
}
// Перемещение бота к точке с коллизиями
function moveBot(b, tx, tz, speed, dt) {
  const m = b.mesh.position, dx = tx - m.x, dz = tz - m.z, d = Math.hypot(dx, dz);
  if (d < 0.05) return;
  const ox = m.x, oz = m.z, st = Math.min(d, speed * dt);
  m.x += dx / d * st; m.z += dz / d * st;
  collide(m, 0.55);
  b.ph = (b.ph || 0) + st * 4; const a = Math.sin(b.ph) * 0.7; b.legL.rotation.x = a; b.legR.rotation.x = -a;   // шаг
  b.mesh.rotation.y = Math.atan2(dx, dz);
  b.stuck = Math.hypot(m.x - ox, m.z - oz) < st * 0.3 ? b.stuck + dt : 0;
}
// Есть ли прямая видимость до игрока (ящики не мешают)
function clearLOS(b, dist) {
  const m = b.mesh.position, o = new THREE.Vector3(m.x, 1.5, m.z);
  const dir = P.pos.clone().sub(o).normalize();
  rc.set(o, dir); rc.far = dist;
  return rc.intersectObjects(crateMeshes, false).length === 0;
}
// Выстрел бота: луч в игрока со случайным разбросом
function botShoot(b, dist) {
  const m = b.mesh.position, o = new THREE.Vector3(m.x, 1.5, m.z);
  const tgt = P.pos.clone(); tgt.y -= 0.4;
  const dir = tgt.clone().sub(o).normalize();
  dir.x += (Math.random() - 0.5) * 0.12; dir.y += (Math.random() - 0.5) * 0.12; dir.z += (Math.random() - 0.5) * 0.12;
  dir.normalize();
  sfx.bot(1 - dist / 25);
  b.fl.visible = true; b.flT = 0.06;
  tracer(o.clone().add(new THREE.Vector3(Math.sin(b.mesh.rotation.y) * 0.9, -0.15, Math.cos(b.mesh.rotation.y) * 0.9)), o.clone().add(dir.clone().multiplyScalar(dist)), 0xffb060);
  const w = tgt.clone().sub(o), t = w.dot(dir);
  const closest = w.sub(dir.clone().multiplyScalar(t)).length();
  if (t > 0 && closest < 0.55) hurtPlayer(15);
}

function updateBots(dt) {
  for (const b of bots) {
    if (b.dead) {   // труп падает назад и лежит до респавна
      b.respT -= dt;
      if (b.mesh.rotation.x > -1.5) { b.mesh.rotation.x -= dt * 4; b.mesh.position.y = Math.max(0.3, b.mesh.position.y - dt * 3); }
      if (b.respT <= 0) placeBot(b); continue;
    }   // респавн через 5 сек
    const m = b.mesh.position;
    b.coverCd -= dt;
    if (b.flT > 0 && (b.flT -= dt) <= 0) b.fl.visible = false;
    const dx = P.pos.x - m.x, dz = P.pos.z - m.z, dist = Math.hypot(dx, dz);

    // Укрытие: HP < 30 → бежим к ближайшему ящику и прячемся за ним 3 сек
    if (b.hp < 30 && b.state !== 'cover' && b.coverCd <= 0) {
      b.state = 'cover'; b.cover = nearestCrate(m); b.hideT = 0; b.sees = false;
    }
    if (b.state === 'cover') {
      const c = b.cover, ux = c.x - P.pos.x, uz = c.z - P.pos.z, l = Math.hypot(ux, uz) || 1;
      const t = Math.min(c.hx / Math.abs(ux || 1e-6), c.hz / Math.abs(uz || 1e-6)), hx = c.x + ux * t + ux / l * 1.4, hz = c.z + uz * t + uz / l * 1.4;   // точка за укрытием
      moveBot(b, hx, hz, 5, dt);
      if (Math.hypot(hx - m.x, hz - m.z) < 0.9) b.hideT += dt;
      if (b.hideT >= 3) { b.state = 'patrol'; b.coverCd = 8; pickTarget(b); }
      continue;
    }

    // Обнаружение: FOV 90° (cos 45° ≈ 0.707), дистанция < 20, прямая видимость
    let sees = false;
    if (!P.dead && dist < 20 && dist > 0.01) {
      const r = b.mesh.rotation.y, dot = (Math.sin(r) * dx + Math.cos(r) * dz) / dist;
      sees = dot > 0.7071 && clearLOS(b, dist);
    }
    if (sees) {
      b.mesh.rotation.y = Math.atan2(dx, dz); b.legL.rotation.x = b.legR.rotation.x = 0;   // остановился и целится
      if (!b.sees) { b.react = 0.4; b.shootT = 0; }      // реакция 0.4 сек
      b.sees = true;
      if (b.react > 0) b.react -= dt;
      else { b.shootT -= dt; if (b.shootT <= 0) { b.shootT = 0.3; botShoot(b, dist); } }   // раз в 0.3 сек
    } else {
      b.sees = false;                                    // патрулирование
      moveBot(b, b.target.x, b.target.z, 2.5, dt);
      if (Math.hypot(b.target.x - m.x, b.target.z - m.z) < 1 || b.stuck > 1.5) pickTarget(b);
    }
  }
}

function damageBot(b, head) {
  b.hp -= head ? 100 : 25;                                // голова — 100, тело — 25
  sfx.hit(head); hitMarker(); burst(b.mesh.position.clone().setY(1.3), 0x7a0c0c, head ? 14 : 7);
  b.mesh.rotation.y = Math.atan2(P.pos.x - b.mesh.position.x, P.pos.z - b.mesh.position.z);
  if (b.hp <= 0) {
    b.dead = true; b.fl.visible = false; b.respT = 5; b.sees = false;
    P.frags++; P.reserve += 30; updateScore(); updateHUD();
    if (P.frags >= WIN) endGame(true);
  }
}

// ===================== HUD И ЭКРАНЫ =====================
function hitMarker() {
  const c = $('cross'); c.classList.add('hit');
  setTimeout(() => c.classList.remove('hit'), 120);
}
function updateHUD() {
  $('hpnum').textContent = P.hp; $('hpfill').style.width = P.hp + '%';
  $('am').textContent = P.ammo; $('rs').textContent = P.reserve;
  $('rl').textContent = P.reloading ? 'ПЕРЕЗАРЯДКА…' : '';
}
function updateScore() { $('score').textContent = 'Ты: ' + P.frags + ' | Боты: ' + botFrags; }

function resetGame() {
  P.frags = 0; botFrags = 0; matchT = 180; P.dead = false; P.respT = 0;
  bots.forEach(placeBot);
  respawnPlayer(); updateScore();
  $('death').classList.add('hide'); $('end').classList.add('hide');
}
function endGame(win) {
  state = 'ended'; P.firing = false;
  document.exitPointerLock && document.exitPointerLock();
  $('death').classList.add('hide');
  $('endTitle').textContent = win === null ? 'Время вышло: ничья' : win ? 'Победа! (' + P.frags + ' фрагов)' : 'Поражение';
  $('endScore').textContent = 'Ты: ' + P.frags + ' | Боты: ' + botFrags;
  $('end').classList.remove('hide');
}

// ===================== ВВОД =====================
function bindInput() {
  const cv = renderer.domElement;
  addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'KeyR' && state === 'play') reload();
    if (e.code === 'Space') e.preventDefault();
  });
  addEventListener('keyup', e => keys[e.code] = false);
  addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('mousedown', e => {
    if (state !== 'play') return;
    if (document.pointerLockElement !== cv) { if (!P.dead) cv.requestPointerLock(); return; }   // клик возвращает захват мыши
    if (e.button === 0) P.firing = true;
    if (e.button === 2) P.aim = true;
  });
  addEventListener('mouseup', e => {
    if (e.button === 0) P.firing = false;
    if (e.button === 2) P.aim = false;
  });
  addEventListener('mousemove', e => {
    if (document.pointerLockElement !== cv || state !== 'play') return;
    const k = P.aim ? 0.0011 : 0.002;
    P.yaw -= e.movementX * k;
    P.pitch = Math.max(-1.5, Math.min(1.5, P.pitch - e.movementY * k));
    P.swY = (P.swY || 0) + e.movementX * 0.0008; P.swX = (P.swX || 0) + e.movementY * 0.0008;
  });
  document.addEventListener('pointerlockchange', () => {
    if (document.pointerLockElement !== cv && state === 'play' && !P.dead) {
      state = 'paused'; P.firing = false; P.aim = false;
      $('bPlay').textContent = 'Продолжить'; $('menu').classList.remove('hide');
    }
  });
  
}

// ===================== МЕНЮ =====================
function bindUI() {
  $('bPlay').onclick = () => {
    audio();
    $('menu').classList.add('hide'); $('hud').style.display = 'block';
    if (state !== 'paused') resetGame();
    state = 'play';
    renderer.domElement.requestPointerLock();
  };
  $('bSet').onclick = () => { const s = $('sets'); s.style.display = s.style.display === 'flex' ? 'none' : 'flex'; };
  $('vol').oninput = e => { vol = e.target.value / 100; if (master) master.gain.value = vol; };
  $('bExit').onclick = () => {
    window.close();
    $('menuMsg').textContent = 'Игра закрыта. Можно закрыть вкладку.';
  };
  $('respBtn').onclick = () => { if (P.dead) respawnPlayer(); };
  $('menuBtn').onclick = () => {
    state = 'menu'; $('end').classList.add('hide'); $('hud').style.display = 'none';
    $('bPlay').textContent = 'Играть'; $('menu').classList.remove('hide');
  };
}

// ===================== ГЛАВНЫЙ ЦИКЛ =====================
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (state === 'play') { updatePlayer(dt); updateBots(dt); tickMatch(dt); drawMinimap(); updateParts(dt); }
  else camera.rotation.y += dt * 0.12;                    // медленное вращение камеры в меню
  renderer.render(scene, camera);
}

init();
</script>
</body>
