<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>WAREHOUSE DUEL</title>
<style>
:root{--ink:#ecebe6;--panel:rgba(16,18,20,.92);--hz:#f2c200;--red:#e5412d;--grn:#7ddc4c;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#ecebe6;--panel:rgba(16,18,20,.92)}}
:root[data-theme="dark"]{--ink:#ecebe6;--panel:rgba(16,18,20,.92)}
html,body{margin:0;height:100%;overflow:hidden;background:#101214;color:var(--ink);font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;font-weight:600;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0}
body>canvas{filter:saturate(.78) contrast(1.08)}
#vig{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%)}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--panel);z-index:10;text-align:center;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
.ov.hide{display:none}
h1{font-size:clamp(34px,9vw,72px);letter-spacing:.14em;margin:0 0 6px;font-weight:800;color:var(--hz);text-shadow:0 2px 12px #000}
.stripe{width:min(360px,70vw);height:10px;margin-bottom:18px;background:repeating-linear-gradient(135deg,var(--hz) 0 14px,#16181a 14px 28px)}
button{font:inherit;font-size:20px;letter-spacing:.06em;padding:12px 30px;min-width:230px;border:2px solid var(--hz);background:#16181a;color:var(--ink);cursor:pointer;transition:background .15s,color .15s}
button:hover,button:active{background:var(--hz);color:#111}
#sets{display:none;flex-direction:column;gap:8px;align-items:center}
#sets label{font-size:14px;opacity:.8}
#sets input{width:220px;accent-color:var(--hz)}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none;text-shadow:0 1px 4px #000}
#hurt{position:absolute;inset:0;box-shadow:inset 0 0 120px 30px var(--red);opacity:0;transition:opacity .1s}
#score{position:absolute;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:22px;font-weight:700;letter-spacing:.08em;background:rgba(0,0,0,.5);padding:4px 16px;border-radius:4px}
#timer{position:absolute;top:calc(44px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:18px;opacity:.85;font-variant-numeric:tabular-nums}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#fff;box-shadow:0 0 2px #000;transition:transform .05s,background .05s}
#cross.hit{background:var(--red);transform:scale(2.2)}
#hp{position:absolute;left:20px;bottom:calc(20px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px}
#hpbar{position:relative;width:220px;height:18px;background:rgba(0,0,0,.6);border:2px solid #000;border-radius:2px;overflow:hidden}
#hpbar::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 12px,rgba(0,0,0,.3) 12px 14px);pointer-events:none}
#hpfill{display:block;height:100%;width:100%;background:linear-gradient(90deg,#5a8,var(--grn));transition:width .15s,background .2s}
#hpnum{font-size:28px;font-weight:700;min-width:42px;text-align:right}
#ammo{position:absolute;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));text-align:right}
#am{font-size:42px;font-weight:700;line-height:1}
#rs{font-size:22px;opacity:.7;margin-left:4px}
#rl{font-size:14px;color:var(--hz);height:18px;text-align:right;margin-top:2px}
#mini{position:absolute;left:calc(14px + env(safe-area-inset-left));top:calc(14px + env(safe-area-inset-top));width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(20,24,28,.7);box-shadow:0 0 0 2px rgba(0,0,0,.5),inset 0 0 20px rgba(0,0,0,.5)}
.killfeed{position:absolute;right:20px;top:calc(80px + env(safe-area-inset-top));width:260px;text-align:right;pointer-events:none}
.killfeed div{margin-bottom:4px;padding:4px 8px;background:rgba(0,0,0,.5);border-radius:3px;font-size:13px;opacity:0;animation:kfIn .2s forwards}
@keyframes kfIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@media (max-width:600px){#hpbar{width:160px}#am{font-size:34px}#mini{width:100px;height:100px}}
</style>
</head>
<body>

<div id="menu" class="ov">
  <h1>WAREHOUSE DUEL</h1><div class="stripe"></div>
  <button id="bPlay">Играть</button>
  <button id="bSet">Настройки</button>
  <div id="sets"><label for="vol">Громкость</label><input id="vol" type="range" min="0" max="100" value="50"><label for="qual">Качество</label><select id="qual"><option value="2">Высокое</option><option value="1" selected>Среднее</option><option value="0">Низкое</option></select></div>
  <button id="bExit">Выход</button>
  <div id="menuMsg" style="max-width:520px;opacity:.7;font-size:14px;line-height:1.5;margin-top:10px">WASD — движение, мышь — обзор, ЛКМ — огонь, ПКМ — прицел, R — перезарядка, Shift — бег, Space — прыжок</div>
</div>

<div id="death" class="ov hide"><h1>Ты убит</h1><button id="respBtn">Возродиться (3)</button></div>
<div id="end" class="ov hide"><h1 id="endTitle">Победа!</h1><div id="endScore"></div><button id="menuBtn">В меню</button></div>

<div id="vig"></div>
<div id="hud">
  <div id="hurt"></div>
  <canvas id="mini" width="128" height="128"></canvas>
  <div id="score">Ты: 0 | Боты: 0</div><div id="timer">3:00</div>
  <div id="cross"></div>
  <div id="hp"><div id="hpbar"><i id="hpfill"></i></div><b id="hpnum">100</b></div>
  <div id="ammo"><b id="am">30</b><span id="rs">/90</span><div id="rl"></div></div>
  <div class="killfeed" id="kf"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===================== КОНСТАНТЫ И СОСТОЯНИЕ =====================
const $ = id => document.getElementById(id);
const HALF = 30, WIN = 10, MAG = 30;
let scene, camera, renderer, clock, composer, gun, flash, muzzle, shell;
let state = 'menu', botFrags = 0, hurtA = 0, vol = 0.5, qual = 1, actx, master, conv;
const crates = [], crateMeshes = [], wallMeshes = [], bots = [], parts = [], decals = [], shells = [], killfeed = [];
const keys = {}, rc = new THREE.Raycaster();
const P = { pos:new THREE.Vector3(0,1.7,14), vy:0, yaw:0, pitch:0, hp:100, dead:false, respT:0, frags:0, ammo:MAG, reserve:90, reloading:false, reloadT:0, last:0, firing:false, aim:false, jumpReq:false, kick:0, flashT:0, bob:0, stepN:0, swX:0, swY:0, adsProg:0, reloadProg:0, lean:0 };
const CFG = { shadowRes:2048, ssao:true, bloom:true, grain:.03, vignette:.4, chromAb:.0008, exposure:1.05, fogNear:28, fogFar:110, fogCol:0xbcc0c3 };

// ===================== УТИЛИТЫ =====================
const mkTex = (w,h,draw,rx,ry,flipY=false)=>{const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=8;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx||1,ry||1);t.flipY=flipY;return t;};
const speckle = (g,w,h,n,a)=>{for(let i=0;i<n;i++){g.fillStyle='rgba('+(Math.random()<.5?'0,0,0,':'255,255,255,')+Math.random()*a+')';g.fillRect(Math.random()*w,Math.random()*h,2+Math.random()*6,2+Math.random()*6);}};
const noiseTex = (w,h)=>mkTex(w,h,(g,W,H)=>{for(let y=0;y<H;y++)for(let x=0;x<W;x++){const v=Math.random()*255|0;g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(x,y,1,1);}},1,1);
const normalFromBump = (bump,scale)=>{const c=document.createElement('canvas');c.width=bump.width;c.height=bump.height;const ctx=c.getContext('2d');ctx.drawImage(bump,0,0);const src=ctx.getImageData(0,0,c.width,c.height),dst=ctx.createImageData(c.width,c.height);for(let y=1;y<c.height-1;y++)for(let x=1;x<c.width-1;x++){const i=(y*c.width+x)*4,il=((y*c.width+x-1)*4),ir=((y*c.width+x+1)*4),it=(((y-1)*c.width+x)*4),ib=(((y+1)*c.width+x)*4);const dx=(src.data[ir]-src.data[il])*scale,dy=(src.data[ib]-src.data[it])*scale;dst.data[i]=128+dx*128;dst.data[i+1]=128+dy*128;dst.data[i+2]=255;dst.data[i+3]=255;}ctx.putImageData(dst,0,0);return new THREE.CanvasTexture(c);};
const lerp = (a,b,t)=>a+(b-a)*t;
const clamp = (v,min,max)=>Math.max(min,Math.min(max,v));
const rand = (a,b)=>a+Math.random()*(b-a);
const randVec = (r)=>new THREE.Vector3(rand(-r,r),rand(-r,r),rand(-r,r));

// ===================== ИНИЦИАЛИЗАЦИЯ =====================
function init(){
  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=CFG.exposure;
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.setSize(innerWidth,innerHeight);
  document.body.prepend(renderer.domElement);
  camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,200);
  camera.rotation.order='YXZ';
  clock=new THREE.Clock();
  setupScene();
  for(let i=0;i<4;i++)makeBot();
  bindInput();bindUI();initAudio();initPost();
  addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();if(composer)composer.setSize(innerWidth,innerHeight);});
  camera.position.copy(P.pos);
  loop();
}

// ===================== ПОСТОБРАБОТКА =====================
function initPost(){
  try{
    const EffectComposer=THREE.EffectComposer,RenderPass=THREE.RenderPass,ShaderPass=THREE.ShaderPass,UnrealBloomPass=THREE.UnrealBloomPass,FilmPass=THREE.FilmPass;
    composer=new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene,camera));
    if(CFG.ssao){const ssao=new ShaderPass(SSAOShader);ssao.uniforms.tDepth.value=composer.renderTarget2.depthTexture;ssao.uniforms.cameraNear.value=camera.near;ssao.uniforms.cameraFar.value=camera.far;ssao.uniforms.resolution.value.set(innerWidth,innerHeight);composer.addPass(ssao);}
    if(CFG.bloom){const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.6,.4,.85);composer.addPass(bloom);}
    const film=new FilmPass(CFG.grain*255,.02,2048,false);composer.addPass(film);
    const ca=new ShaderPass(ChromAbShader);ca.uniforms.amount.value=CFG.chromAb;composer.addPass(ca);
    const cc=new ShaderPass(ColorCorrectionShader);composer.addPass(cc);
    const vig=new ShaderPass(VignetteShader);vig.uniforms.amount.value=CFG.vignette;composer.addPass(vig);
  }catch(e){console.warn('PostFX fallback:',e);composer=null;}
}
const SSAOShader={uniforms:{tDiffuse:{value:null},tDepth:{value:null},cameraNear:{value:0},cameraFar:{value:0},resolution:{value:new THREE.Vector2()}},vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,fragmentShader:`varying vec2 vUv;uniform sampler2D tDiffuse;uniform sampler2D tDepth;uniform float cameraNear;uniform float cameraFar;uniform vec2 resolution;float readDepth(vec2 uv){return texture2D(tDepth,uv).r;}float getViewZ(const in float depth){float near=cameraNear;float far=cameraFar;return 2.0*near*far/(far+near-depth*(far-near));}void main(){vec2 invRes=1.0/resolution;float centerDepth=getViewZ(readDepth(vUv));float occ=0.0;for(int x=-2;x<=2;x++)for(int y=-2;y<=2;y++){if(x==0&&y==0)continue;vec2 uv=vUv+vec2(float(x),float(y))*invRes*4.0;float sampleDepth=getViewZ(readDepth(uv));float diff=sampleDepth-centerDepth;if(diff>0.01)occ+=1.0;}occ/=24.0;occ=1.0-smoothstep(0.0,1.0,occ);gl_FragColor=texture2D(tDiffuse,vUv)*vec4(vec3(occ),1.0);}`}
const ChromAbShader={uniforms:{tDiffuse:{value:null},amount:{value:0}},vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,fragmentShader:`varying vec2 vUv;uniform sampler2D tDiffuse;uniform float amount;void main(){vec2 offset=amount*(vUv-0.5);gl_FragColor.r=texture2D(tDiffuse,vUv+offset).r;gl_FragColor.g=texture2D(tDiffuse,vUv).g;gl_FragColor.b=texture2D(tDiffuse,vUv-offset).b;gl_FragColor.a=1.0;}`}
const ColorCorrectionShader={uniforms:{tDiffuse:{value:null}},vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,fragmentShader:`varying vec2 vUv;uniform sampler2D tDiffuse;void main(){vec3 col=texture2D(tDiffuse,vUv).rgb;col=pow(col,vec3(0.95));col*=vec3(1.02,1.0,0.98);gl_FragColor=vec4(col,1.0);}`}
const VignetteShader={uniforms:{tDiffuse:{value:null},amount:{value:0}},vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,fragmentShader:`varying vec2 vUv;uniform sampler2D tDiffuse;uniform float amount;void main(){vec3 col=texture2D(tDiffuse,vUv).rgb;float dist=length(vUv-0.5)*2.0;col*=1.0-amount*dist*dist;gl_FragColor=vec4(col,1.0);}`}

// ===================== СЦЕНА =====================
let matchT=180;
function setupScene(){
  scene=new THREE.Scene();
  scene.fog=new THREE.Fog(CFG.fogCol,CFG.fogNear,CFG.fogFar);
  scene.add(new THREE.HemisphereLight(0xe4e8ec,0x4a4e52,.35));
  const sun=new THREE.DirectionalLight(0xfff2dc,1.3);sun.position.set(-22,24,-14);
  sun.castShadow=true;sun.shadow.mapSize.set(CFG.shadowRes,CFG.shadowRes);
  const sc=sun.shadow.camera;sc.left=sc.bottom=-42;sc.right=sc.top=42;sc.near=1;sc.far=90;sun.shadow.bias=-.0005;sun.shadow.normalBias=.02;
  scene.add(sun);
  // Cascaded shadow helper (fake second cascade)
  const sun2=new THREE.DirectionalLight(0xfff2dc,.4);sun2.position.set(20,30,20);sun2.castShadow=true;sun2.shadow.mapSize.set(1024,1024);const sc2=sun2.shadow.camera;sc2.left=sc2.bottom=-60;sc2.right=sc2.top=60;sc2.near=1;sc2.far=120;scene.add(sun2);

  // Sky dome with gradient
  const skyT=mkTex(16,256,(g,W,H)=>{const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#5a626a');gr.addColorStop(.5,'#b8bcc0');gr.addColorStop(1,'#c8cbd0');g.fillStyle=gr;g.fillRect(0,0,W,H);},1,1,true);
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(150,16,12),new THREE.MeshBasicMaterial({map:skyT,side:THREE.BackSide,fog:false,toneMapped:false})));

  // Environment map for PBR
  const envScene=new THREE.Scene();
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50,16,12),new THREE.MeshBasicMaterial({map:skyT,side:THREE.BackSide})));
  scene.environment=new THREE.PMREMGenerator(renderer).fromScene(envScene).texture;

  // Asphalt with cracks, puddles, markings
  const asph=mkTex(512,512,(g,W,H)=>{
    g.fillStyle='#4a5056';g.fillRect(0,0,W,H);
    speckle(g,W,H,3000,.25);
    g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=1.5;
    for(let i=0;i<12;i++){g.beginPath();let x=Math.random()*W,y=Math.random()*H;g.moveTo(x,y);for(let k=0;k<12;k++){x+=(Math.random()-.5)*60;y+=(Math.random()-.5)*60;g.lineTo(x,y);}g.stroke();}
    for(let i=0;i<8;i++){g.fillStyle='rgba(10,15,20,.3)';g.beginPath();g.ellipse(Math.random()*W,Math.random()*H,30+Math.random()*50,15+Math.random()*25,Math.random()*3,0,7);g.fill();}
    // Puddles
    for(let i=0;i<5;i++){const px=Math.random()*W,py=Math.random()*H,rx=20+Math.random()*40,ry=10+Math.random()*20;const pg=g.createRadialGradient(px,py,0,px,py,Math.max(rx,ry));pg.addColorStop(0,'rgba(60,70,80,.6)');pg.addColorStop(1,'rgba(60,70,80,0)');g.fillStyle=pg;g.beginPath();g.ellipse(px,py,rx,ry,Math.random()*3,0,7);g.fill();}
  },24,24);
  const asphBump=mkTex(512,512,(g,W,H)=>{g.fillStyle='#808080';g.fillRect(0,0,W,H);speckle(g,W,H,2000,.15);},24,24);
  const asphNorm=normalFromBump(asphBump.image,1.5);
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(HALF*2,HALF*2),new THREE.MeshStandardMaterial({map:asph,normalMap:asphNorm,normalScale:new THREE.Vector2(.8,.8),roughness:.95,metalness:0}));
  floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);

  // Outside ground
  const out=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshLambertMaterial({color:0x4b5056}));out.rotation.x=-Math.PI/2;out.position.y=-.03;scene.add(out);
  [-7,7].forEach(x=>{const l=new THREE.Mesh(new THREE.PlaneGeometry(.25,HALF*2-2),new THREE.MeshBasicMaterial({color:0xc9a400}));l.rotation.x=-Math.PI/2;l.position.set(x,.02,0);scene.add(l);});

  // Fence
  const fenceT=mkTex(64,64,g=>{g.strokeStyle='rgba(175,180,186,.95)';g.lineWidth=2;g.beginPath();g.moveTo(0,0);g.lineTo(64,64);g.moveTo(0,64);g.lineTo(64,0);g.stroke();},HALF*2,4,true);
  const fm=new THREE.MeshLambertMaterial({map:fenceT,alphaTest:.4,side:THREE.DoubleSide});
  [[0,-HALF,0],[0,HALF,0],[-HALF,0,1],[HALF,0,1]].forEach(([x,z,r])=>{const w=new THREE.Mesh(new THREE.PlaneGeometry(HALF*2,4),fm);w.position.set(x,2,z);w.rotation.y=r*Math.PI/2;scene.add(w);wallMeshes.push(w);});

  // Containers
  const C={r:'#8e2f26',g:'#5f7d3c',b:'#35567e',s:'#a3a39c',y:'#c9a02c'};
  [[-14,-14,2.6,12,C.r],[-2,-18,12,2.6,C.g],[14,-14,2.6,12,C.b],[-20,2,12,2.6,C.s],[0,-4,2.6,12,C.y],[20,2,12,2.6,C.r],[-14,16,2.6,12,C.b],[2,18,12,2.6,C.s],[16,14,2.6,12,C.g]].forEach(a=>addContainer(...a));

  // Wooden crates
  const wood=mkTex(256,256,(g,W,H)=>{g.fillStyle='#7a4a22';g.fillRect(0,0,W,H);for(let y=0;y<H;y+=32){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,y,W,3);}g.fillStyle='rgba(0,0,0,.3)';g.fillRect(0,0,12,H);g.fillRect(W-12,0,12,H);speckle(g,W,H,300,.3);},6,6);
  const woodBump=mkTex(256,256,(g,W,H)=>{g.fillStyle='#808080';g.fillRect(0,0,W,H);for(let y=0;y<H;y+=32){g.fillStyle='#606060';g.fillRect(0,y,W,3);}speckle(g,W,H,200,.1);},6,6);
  const woodNorm=normalFromBump(woodBump.image,1.2);
  const woodMat=new THREE.MeshStandardMaterial({map:wood,normalMap:woodNorm,normalScale:new THREE.Vector2(1,1),roughness:.85});
  [[-6,8],[8,6],[-4,-10],[8,-6],[-8,-4],[24,-6],[-24,-8],[-24,20]].forEach(([x,z])=>addCrate(x,z,woodMat));

  // Props: barrels, forklift, pallets, truck, tires, cables, lamps
  addProps();
  // Distant buildings
  addDistantBuildings();
  // Concrete blocks
  addConcreteBlocks();

  // Gun + hands
  scene.add(camera);
  gun=new THREE.Group();
  buildRifle(gun);
  addHands(gun);
  flash=new THREE.Mesh(new THREE.PlaneGeometry(.3,.3),new THREE.MeshBasicMaterial({color:0xffd24a,transparent:true,opacity:.9,depthWrite:false}));flash.position.set(0,.01,-1.05);flash.visible=false;gun.add(flash);
  muzzle=new THREE.PointLight(0xffb060,0,14,2);muzzle.position.set(0,.02,-.9);gun.add(muzzle);
  shell=new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,.03,8),new THREE.MeshStandardMaterial({color:0xc9a02c,roughness:.3,metalness:.8}));shell.visible=false;gun.add(shell);
  gun.position.set(.25,-.22,-.5);
  camera.add(gun);
}

function addContainer(x,z,w,d,col){
  const tile=mkTex(256,256,(g,W,H)=>{
    g.fillStyle=col;g.fillRect(0,0,W,H);
    for(let i=0;i<W;i+=16){g.fillStyle='rgba(0,0,0,.28)';g.fillRect(i,0,5,H);g.fillStyle='rgba(255,255,255,.1)';g.fillRect(i+5,0,2,H);}
    speckle(g,W,H,800,.35);
    for(let i=0;i<12;i++){g.fillStyle='rgba(110,55,20,.22)';g.fillRect(Math.random()*W,0,3+Math.random()*7,H*(.2+Math.random()*.7));}
    // Dents
    for(let i=0;i<6;i++){g.fillStyle='rgba(0,0,0,.15)';g.beginPath();g.ellipse(Math.random()*W,Math.random()*H,8+Math.random()*12,4+Math.random()*8,Math.random()*3,0,7);g.fill();}
  },Math.max(w,d)/2.6,1);
  const side=tile.clone();side.needsUpdate=true;

function buildSoldier(b,hit){
  hit.rotation.order='YXZ';
  const camo=mkTex(256,256,(g,W,H)=>{g.fillStyle='#4f5a3a';g.fillRect(0,0,W,H);['#6b7447','#2f3824','#8a8a62'].forEach(c=>{g.fillStyle=c;for(let i=0;i<40;i++){g.beginPath();g.ellipse(Math.random()*W,Math.random()*H,8+Math.random()*20,5+Math.random()*12,Math.random()*3,0,7);g.fill();}});});

  const bx=(w,h,d)=>new THREE.BoxGeometry(w,h,d),sp=r=>new THREE.SphereGeometry(r,12,10);

    add(bx(.18,.04,.34),S(0x0a0a0a),0,-.45,.06,b.knee); // sole
    return [p,b.knee];
  };
  [b.legL,b.kL]=leg(-.15);[b.legR,b.kR]=leg(.15);
  // Pelvis
  add(bx(.46,.2,.28),cam,0,1,0);
  // Torso
  const torso=new THREE.Group();torso.position.y=1.25;g.add(torso);b.torso=torso;
  add(new THREE.CylinderGeometry(.27,.24,.62,12),cam,0,0,0,torso).scale.z=.62;
  add(bx(.54,.42,.3),vest,0,.07,0,torso);
  // Pouches
  [-.17,0,.17].forEach(x=>add(bx(.12,.15,.08),vest,x,-.11,.2,torso));
  // Shoulder straps
  [-.15,.15].forEach(x=>add(bx(.07,.52,.34),vest,x,.15,0,torso));
  add(new THREE.CylinderGeometry(.26,.26,.07,12),dark,0,-.26,0,torso).scale.z=.6; // belt

  // Arms
  const arm=(sh,el,hd,side)=>{

function buildRifleGroup(){

  const rg=new THREE.ExtrudeGeometry(sh,{depth:.5,bevelEnabled:true,bevelSize:.006,bevelThickness:.006,bevelSegments:1});rg.translate(0,0,-.25);
  add(rg,met,0,0,0);

  add(new THREE.CylinderGeometry(.024,.024,.07,8),met,0,.005,-.94,R);
  add(new THREE.BoxGeometry(.04,.015,.5),met,0,.068,-.05);
  add(new THREE.CylinderGeometry(.028,.028,.13,10),met,0,.11,-.06,R);

function burst(p,col,n){
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(new THREE.BoxGeometry(.05,.05,.05),new THREE.MeshLambertMaterial({color:col}));
    m.position.copy(p);m.userData.v=new THREE.Vector3(rand(-5,5),rand(0,5),rand(-5,5));m.userData.t=1;
    scene.add(m);parts.push(m);
  }
}
function addMuzzleSmoke(p,dir){
  for(let i=0;i<3;i++){
    const m=new THREE.Mesh(new THREE.SphereGeometry(.03+.02*Math.random(),8,6),new THREE.MeshBasicMaterial({color:0xccccbb,transparent:true,opacity:.6,depthWrite:false}));
    m.position.copy(p).addScaledVector(dir,.1).add(randVec(.05));
    m.userData={v:dir.clone().multiplyScalar(rand(.5,1.5)).add(randVec(1)),t:.3+Math.random()*.2,s:1+Math.random()};
    scene.add(m);parts.push(m);
  }
}
function addBlood(p,dir){
  for(let i=0;i<6;i++){
    const m=new THREE.Mesh(new THREE.SphereGeometry(.02,6,5),new THREE.MeshLambertMaterial({color:0x7a0c0c}));
    m.position.copy(p);m.userData.v=dir.clone().multiplyScalar(rand(2,5)).add(randVec(2));m.userData.t=.5;
    scene.add(m);parts.push(m);
  }
}
function addSpark(p,n){
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(new THREE.BoxGeometry(.02,.02,.02),new THREE.MeshBasicMaterial({color:0xffd9a0}));
    m.position.copy(p);m.userData.v=randVec(8);m.userData.t=.2;
    scene.add(m);parts.push(m);
  }
}
function addShell(pos,dir){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,.03,8),new THREE.MeshStandardMaterial({color:0xc9a02c,roughness:.3,metalness:.8}));
  m.position.copy(pos);m.rotation.x=Math.PI/2;m.userData={v:dir.clone().multiplyScalar(rand(1,2)).add(new THREE.Vector3(0,rand(1,3),0)),t:3,spin:randVec(20)};
  scene.add(m);shells.push(m);
}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const m=parts[i],v=m.userData.v;
    v.y-=14*dt;m.position.addScaledVector(v,dt);
    if(m.position.y<.1){m.position.y=.1;v.multiplyScalar(.3);}
    if(m.userData.s)m.scale.multiplyScalar(1+dt*m.userData.s);
    m.rotation.x+=dt*6;m.rotation.y+=dt*4;
    if((m.userData.t-=dt)<=0){scene.remove(m);m.geometry.dispose();m.material.dispose();parts.splice(i,1);}
  }
  for(let i=shells.length-1;i>=0;i--){
    const m=shells[i],v=m.userData.v;
    v.y-=9.8*dt;m.position.addScaledVector(v,dt);
    m.rotation.x+=m.userData.spin.x*dt;m.rotation.y+=m.userData.spin.y*dt;m.rotation.z+=m.userData.spin.z*dt;
    if(m.position.y<.02){m.position.y=.02;v.y*=-.3;v.x*=.7;v.z*=.7;m.userData.spin.multiplyScalar(.5);}
    if((m.userData.t-=dt)<=0){scene.remove(m);m.geometry.dispose();m.material.dispose();shells.splice(i,1);}
  }
}
function tracer(a,b,col){
  const g=new THREE.BufferGeometry().setFromPoints([a,b]);
  const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:col,transparent:true,opacity:.8,fog:false}));
  scene.add(l);setTimeout(()=>{scene.remove(l);g.dispose();l.material.dispose();},60);
}
function impact(p,n){
  const s=new THREE.Mesh(new THREE.BoxGeometry(.05,.05,.05),new THREE.MeshBasicMaterial({color:0xffd9a0}));s.position.copy(p);scene.add(s);setTimeout(()=>{scene.remove(s);s.geometry.dispose();},80);
  if(!n)return;
  const d=new THREE.Mesh(new THREE.CircleGeometry(.07,8),new THREE.MeshBasicMaterial({color:0x0c0c0c,transparent:true,opacity:.7}));
  d.position.copy(p).addScaledVector(n,.012);d.lookAt(p.clone().add(n));scene.add(d);decals.push(d);
  if(decals.length>60){const o=decals.shift();scene.remove(o);o.geometry.dispose();}
}

function drawMinimap(){
  const g=$('mini').getContext('2d'),S=1.5,R=64;
  g.clearRect(0,0,128,128);g.save();g.translate(R,R);g.rotate(P.yaw);

  g.fillStyle='#ff4b3a';
  for(const b of bots)if(!b.dead&&b.sees){g.beginPath();g.arc((b.mesh.position.x-P.pos.x)*S,(b.mesh.position.z-P.pos.z)*S,4,0,7);g.fill();}

// ===================== ЗВУК =====================
function initAudio(){
  if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)();master=actx.createGain();master.connect(actx.destination);buildReverb();startWind();}
  master.gain.value=vol;
  if(actx.state==='suspended')actx.resume();
}
function buildReverb(){
  const rate=actx.sampleRate,len=rate*2,buf=actx.createBuffer(2,len,rate);
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2)*.5;}}
  conv=actx.createConvolver();conv.buffer=buf;conv.connect(master);
}
function startWind(){
  const n=actx.sampleRate*3|0,buf=actx.createBuffer(1,n,actx.sampleRate),d=buf.getChannelData(0);
  let l=0;for(let i=0;i<n;i++){l+=(Math.random()*2-1-l)*.02;d[i]=l*3;}
  const src=actx.createBufferSource();src.buffer=buf;src.loop=true;
  const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=500;
  const g=actx.createGain();g.gain.value=.18;src.connect(f);f.connect(g);g.connect(master);src.start();
}
function playSound(buffer,gain=1,pos=null){
  if(!actx)return;
  const src=actx.createBufferSource();src.buffer=buffer;
  const gn=actx.createGain();gn.gain.value=gain;
  if(pos){const p=actx.createPanner();p.panningModel='HRTF';p.distanceModel='inverse';p.refDistance=1;p.maxDistance=50;p.rolloffFactor=1;p.positionX.value=pos.x;p.positionY.value=pos.y;p.positionZ.value=pos.z;src.connect(p);p.connect(gn);}else{src.connect(gn);}
  gn.connect(conv);gn.connect(master);src.start();
}
function noise(dur,freq,g){
  const n=actx.sampleRate*dur|0,b=actx.createBuffer(1,n,actx.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=actx.createBufferSource();s.buffer=b;
  const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;
  const gn=actx.createGain();gn.gain.value=g;
  s.connect(f);f.connect(gn);gn.connect(master);s.start();return b;
}
function tone(f0,f1,dur,g,type){
  const t=actx.currentTime,o=actx.createOscillator(),gn=actx.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(gn);gn.connect(master);o.start();o.stop(t+dur);
}
const sfx={step:()=>noise(.07,450,.22),shot:()=>{noise(.12,2600,.8);tone(160,40,.12,.6,'square');},bot:(v)=>v>0&&noise(.1,1500,.3*v),hit:(h)=>tone(h?1500:800,h?2200:1100,.09,.4,'sine'),hurt:()=>tone(220,90,.15,.4,'sawtooth'),reload:()=>{[0,450,1300].forEach(ms=>setTimeout(()=>{if(actx){noise(.04,5000,.5);tone(400,200,.05,.3,'square');}},ms));},ricochet:()=>{tone(2000,800,.05,.3,'sine');noise(.03,3000,.2);}};

// ===================== КОЛЛИЗИИ =====================
function collide(p,r){
  p.x=clamp(p.x,-HALF+r,HALF-r);p.z=clamp(p.z,-HALF+r,HALF-r);
  for(const c of crates){
    const nx=clamp(p.x,c.x-c.hx,c.x+c.hx),nz=clamp(p.z,c.z-c.hz,c.z+c.hz);
    const dx=p.x-nx,dz=p.z-nz,d=Math.hypot(dx,dz);
    if(d<r){if(d>1e-4){p.x+=dx/d*(r-d);p.z+=dz/d*(r-d);}else{const ox=c.hx-Math.abs(p.x-c.x),oz=c.hz-Math.abs(p.z-c.z);if(ox<oz)p.x+=(p.x>=c.x?1:-1)*(ox+r);else p.z+=(p.z>=c.z?1:-1)*(oz+r);}}}
}
function randomPoint(away,minD){
  for(let i=0;i<60;i++){
    const x=rand(-HALF+2,HALF-2),z=rand(-HALF+2,HALF-2);
    if(crates.some(c=>Math.abs(x-c.x)<c.hx+1.2&&Math.abs(z-c.z)<c.hz+1.2))continue;
    if(away&&Math.hypot(x-away.x,z-away.z)<minD)continue;
    return{x,z};
  }
  return{x:0,z:-17};
}

// ===================== ИГРОК =====================
function updatePlayer(dt){
  if(P.dead){
    P.respT-=dt;$('respBtn').textContent='Возродиться ('+Math.max(0,Math.ceil(P.respT))+')';
    if(P.respT<=0)respawnPlayer();
    camera.position.y=Math.max(.35,camera.position.y-dt*2);
    return;
  }
  // Movement
  const run=keys.ShiftLeft||keys.ShiftRight;
  const sp=run?8:5;
  let fx=(keys.KeyD?1:0)-(keys.KeyA?1:0),fz=(keys.KeyS?1:0)-(keys.KeyW?1:0);
  const l=Math.hypot(fx,fz);if(l>1){fx/=l;fz/=l;}
  const s=Math.sin(P.yaw),c=Math.cos(P.yaw);
  P.pos.x+=(fx*c+fz*s)*sp*dt;P.pos.z+=(-fx*s+fz*c)*sp*dt;
  collide(P.pos,.4);
  // Jump
  if((keys.Space||P.jumpReq)&&P.pos.y<=1.701)P.vy=7;
  P.vy-=20*dt;P.pos.y+=P.vy*dt;
  if(P.pos.y<1.7){P.pos.y=1.7;P.vy=0;}
  // ADS
  P.adsProg=lerp(P.adsProg,P.aim?1:0,dt*14);
  const tf=lerp(75,42,P.adsProg);
  if(Math.abs(camera.fov-tf)>.1){camera.fov+= (tf-camera.fov)*Math.min(1,dt*14);camera.updateProjectionMatrix();}
  // Reload
  if(P.reloading){
    P.reloadT-=dt;P.reloadProg=1-P.reloadT/1.5;
    if(P.reloadT<=0){const take=Math.min(MAG-P.ammo,P.reserve);P.ammo+=take;P.reserve-=take;P.reloading=false;P.reloadProg=0;updateHUD();}
  }
  if(P.firing)shoot();
  // Camera & gun
  camera.position.copy(P.pos);camera.position.y+=Math.sin(P.bob)*.02;
  camera.rotation.set(P.pitch,P.yaw,0);
  P.kick*=Math.max(0,1-dt*14);
  const moving=Math.hypot(fx,fz)>.1&&P.pos.y<1.71;
  P.bob+=moving?dt*(run?14:10):-dt*8*P.bob;
  const stp=Math.floor(P.bob/Math.PI);if(stp!==P.stepN){P.stepN=stp;if(P.bob>0)sfx.step();}
  const bs=lerp(1,.3,P.adsProg);
  gun.position.set(lerp(.25,0,P.adsProg)+Math.sin(P.bob)*.012*bs,lerp(-.22,-.17,P.adsProg)+Math.abs(Math.cos(P.bob))*.014*bs,-.5+P.kick);
  P.swY*=Math.max(0,1-dt*8);P.swX*=Math.max(0,1-dt*8);
  gun.rotation.y=clamp(P.swY,-.12,.12);
  gun.rotation.x=(P.reloading?-.6:0)+clamp(P.swX,-.12,.12);
  if(P.flashT>0){P.flashT-=dt;if(P.flashT<=0)flash.visible=false;}
  muzzle.intensity*=Math.max(0,1-dt*30);
  hurtA=Math.max(0,hurtA-dt*1.5);$('hurt').style.opacity=hurtA;
  // Lean (Q/E)
  P.lean=lerp(P.lean,(keys.KeyE?1:0)-(keys.KeyQ?1:0),dt*8);
  camera.rotation.z=P.lean*.15;
}

function shoot(){
  const now=performance.now()/1000;
  if(P.dead||P.reloading||now-P.last<.1)return;
  if(P.ammo<=0){reload();return;}
  P.last=now;P.ammo--;
  sfx.shot();
  // Recoil
  P.pitch=Math.min(1.5,P.pitch+.014);P.yaw+=(Math.random()-.5)*.006;
  P.kick=.07;flash.visible=true;P.flashT=.04;muzzle.intensity=3;
  // Shell ejection
  const shellPos=camera.localToWorld(new THREE.Vector3(.08,-.15,-.3));
  const shellDir=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
  addShell(shellPos,shellDir);
  // Raycast
  camera.updateMatrixWorld();
  rc.setFromCamera({x:0,y:0},camera);rc.far=100;
  const targets=crateMeshes.concat(wallMeshes,bots.filter(b=>!b.dead).map(b=>b.mesh));
  const hit=rc.intersectObjects(targets,false)[0];
  const muzzlePos=camera.localToWorld(new THREE.Vector3(.2,-.18,-.9));
  tracer(muzzlePos,hit?hit.point:rc.ray.at(60,new THREE.Vector3()),0xffe08a);
  if(hit&&hit.object.userData.bot){
    const localY=hit.point.y-(hit.object.position.y-1);
    damageBot(hit.object.userData.bot,localY>=4/3);
  }else if(hit){impact(hit.point,hit.face?hit.face.normal.clone().transformDirection(hit.object.matrixWorld):null);sfx.ricochet();}
  addMuzzleSmoke(muzzlePos,new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion));
  updateHUD();
  if(P.ammo===0)reload();
}

function reload(){
  if(P.reloading||P.dead||P.ammo>=MAG||P.reserve<=0)return;
  P.reloading=true;P.reloadT=1.5;sfx.reload();updateHUD();
}

function hurtPlayer(d){
  if(P.dead)return;
  P.hp=Math.max(0,P.hp-d);hurtA=.7;sfx.hurt();updateHUD();
  if(P.hp<=0){P.dead=true;P.respT=3;P.firing=false;botFrags++;updateScore();if(botFrags>=WIN){endGame(false);return;}$('death').classList.remove('hide');document.exitPointerLock&&document.exitPointerLock();}
}

function respawnPlayer(){
  const alive=bots.find(b=>!b.dead);
  const p=randomPoint(alive?alive.mesh.position:null,10);
  P.pos.set(p.x,1.7,p.z);P.vy=0;P.pitch=0;P.yaw=Math.random()*6.28;
  P.hp=100;P.ammo=MAG;P.reserve=90;P.reloading=false;P.dead=false;P.kick=0;P.bob=0;P.adsProg=0;P.lean=0;
  $('death').classList.add('hide');updateHUD();
  if(state==='play'){try{renderer.domElement.requestPointerLock();}catch(e){}}
}

// ===================== БОТЫ =====================
function makeBot(){
  const m=new THREE.Mesh(new THREE.BoxGeometry(1,2,1),new THREE.MeshBasicMaterial({visible:false}));
  const b={mesh:m,hp:100,dead:false,state:'patrol',target:null,react:0,shootT:0,hideT:0,coverCd:0,respT:0,stuck:0,sees:false,cover:null,ph:0,flT:0,aimProg:0,lastVis:0};
  m.userData.bot=b;buildSoldier(b,m);scene.add(m);bots.push(b);
  placeBot(b);
}
function placeBot(b){
  const p=randomPoint(P.pos,10);
  b.mesh.position.set(p.x,1,p.z);b.mesh.rotation.set(0,0,0);b.mesh.visible=true;
  b.hp=100;b.dead=false;b.state='patrol';b.sees=false;b.coverCd=0;b.aimProg=0;
  pickTarget(b);
}
function pickTarget(b){b.target=randomPoint();b.stuck=0;}
function nearestCrate(p){let best=crates[0],bd=1e9;for(const c of crates){const d=Math.hypot(Math.max(Math.abs(p.x-c.x)-c.hx,0),Math.max(Math.abs(p.z-c.z)-c.hz,0));if(d<bd){bd=d;best=c;}}return best;}
function moveBot(b,tx,tz,speed,dt){
  const m=b.mesh.position,dx=tx-m.x,dz=tz-m.z,d=Math.hypot(dx,dz);
  if(d<.05)return;
  const ox=m.x,oz=m.z,st=Math.min(d,speed*dt);
  m.x+=dx/d*st;m.z+=dz/d*st;
  collide(m,.55);
  b.ph+=st*4;const a=Math.sin(b.ph)*.7;b.legL.rotation.x=a;b.legR.rotation.x=-a;b.kL.rotation.x=Math.max(0,a);b.kR.rotation.x=Math.max(0,-a);
  b.mesh.rotation.y=Math.atan2(dx,dz);
  b.stuck=Math.hypot(m.x-ox,m.z-oz)<st*.3?b.stuck+dt:0;
}
function clearLOS(b,dist){
  const m=b.mesh.position,o=new THREE.Vector3(m.x,1.5,m.z);
  const dir=P.pos.clone().sub(o).normalize();
  rc.set(o,dir);rc.far=dist;
  return rc.intersectObjects(crateMeshes,false).length===0;
}
function botShoot(b,dist){
  const m=b.mesh.position,o=new THREE.Vector3(m.x,1.5,m.z);
  const tgt=P.pos.clone();tgt.y-=.4;
  const dir=tgt.clone().sub(o).normalize();
  dir.x+=(Math.random()-.5)*.12;dir.y+=(Math.random()-.5)*.12;dir.z+=(Math.random()-.5)*.12;dir.normalize();
  sfx.bot(1-dist/25);
  b.fl.visible=true;b.flT=.06;
  const muzzlePos=new THREE.Vector3(Math.sin(b.mesh.rotation.y)*.9,-.15,Math.cos(b.mesh.rotation.y)*.9).add(o);
  tracer(muzzlePos,o.clone().add(dir.clone().multiplyScalar(dist)),0xffb060);
  const w=tgt.clone().sub(o),t=w.dot(dir);
  const closest=w.sub(dir.clone().multiplyScalar(t)).length();
  if(t>0&&closest<.55){hurtPlayer(15);addBlood(camera.position.clone(),dir.negate());}
}
function updateBots(dt){
  for(const b of bots){
    if(b.dead){
      b.respT-=dt;
      if(b.mesh.rotation.x>-1.5){b.mesh.rotation.x-=dt*4;b.mesh.position.y=Math.max(.3,b.mesh.position.y-dt*3);}
      if(b.respT<=0)placeBot(b);
      continue;
    }
    const m=b.mesh.position;
    b.coverCd-=dt;
    if(b.flT>0&&(b.flT-=dt)<=0)b.fl.visible=false;
    const dx=P.pos.x-m.x,dz=P.pos.z-m.z,dist=Math.hypot(dx,dz);
    // Cover behavior
    if(b.hp<30&&b.state!=='cover'&&b.coverCd<=0){b.state='cover';b.cover=nearestCrate(m);b.hideT=0;b.sees=false;}
    if(b.state==='cover'){
      const c=b.cover,ux=c.x-P.pos.x,uz=c.z-P.pos.z,l=Math.hypot(ux,uz)||1;
      const t=Math.min(c.hx/Math.abs(ux||1e-6),c.hz/Math.abs(uz||1e-6)),hx=c.x+ux*t+ux/l*1.4,hz=c.z+uz*t+uz/l*1.4;
      moveBot(b,hx,hz,5,dt);
      if(Math.hypot(hx-m.x,hz-m.z)<.9)b.hideT+=dt;
      if(b.hideT>=3){b.state='patrol';b.coverCd=8;pickTarget(b);}
      continue;
    }
    // Detection
    let sees=false;
    if(!P.dead&&dist<20&&dist>.01){
      const r=b.mesh.rotation.y,dot=(Math.sin(r)*dx+Math.cos(r)*dz)/dist;
      sees=dot>.7071&&clearLOS(b,dist);
    }
    if(sees){
      b.lastVis=dist;
      b.mesh.rotation.y=Math.atan2(dx,dz);
      b.legL.rotation.x=b.legR.rotation.x=b.kL.rotation.x=b.kR.rotation.x=0;
      if(!b.sees){b.react=.4;b.shootT=0;b.aimProg=0;}
      b.sees=true;b.aimProg=Math.min(1,b.aimProg+dt*5);
      if(b.react>0)b.react-=dt;
      else{b.shootT-=dt;if(b.shootT<=0){b.shootT=.3;botShoot(b,dist);}}
      // Torso turn towards player
      b.torso.rotation.y=lerp(b.torso.rotation.y,Math.atan2(dx,dz)-b.mesh.rotation.y,dt*5);
      // Head turn
      b.head.rotation.y=lerp(b.head.rotation.y,Math.atan2(dx,dz)-b.mesh.rotation.y,dt*8);
    }else{
      b.sees=false;b.aimProg=Math.max(0,b.aimProg-dt*3);
      moveBot(b,b.target.x,b.target.z,2.5,dt);
      if(Math.hypot(b.target.x-m.x,b.target.z-m.z)<1||b.stuck>1.5)pickTarget(b);
      b.torso.rotation.y=lerp(b.torso.rotation.y,0,dt*3);
      b.head.rotation.y=lerp(b.head.rotation.y,0,dt*3);
    }
    // Breathing idle
    if(!sees&&b.state==='patrol'){b.mesh.position.y=1+Math.sin(performance.now()/1000+b.mesh.position.x)*.01;}
  }
}
function damageBot(b,head){
  b.hp-=head?100:25;
  sfx.hit(head);hitMarker();burst(b.mesh.position.clone().setY(1.3),0x7a0c0c,head?14:7);
  addBlood(b.mesh.position.clone().setY(1.3),new THREE.Vector3().subVectors(P.pos,b.mesh.position).normalize());
  b.mesh.rotation.y=Math.atan2(P.pos.x-b.mesh.position.x,P.pos.z-b.mesh.position.z);
  if(b.hp<=0){
    b.dead=true;b.fl.visible=false;b.respT=5;b.sees=false;
    P.frags++;P.reserve+=30;updateScore();updateHUD();
    addKillfeed('Ты устранил бота',true);
    if(P.frags>=WIN)endGame(true);
  }
}

// ===================== HUD И ЭКРАНЫ =====================
function updateHUD(){
  $('hpnum').textContent=P.hp;$('hpfill').style.width=P.hp+'%';
  $('hpfill').style.background=P.hp>50?'linear-gradient(90deg,#5a8,var(--grn))':P.hp>25?'linear-gradient(90deg,#ca5,var(--hz))':'linear-gradient(90deg,#a33,var(--red))';
  $('am').textContent=P.ammo;$('rs').textContent='/'+P.reserve;
  $('rl').textContent=P.reloading?'ПЕРЕЗАРЯДКА…':'';
}
function updateScore(){$('score').textContent='Ты: '+P.frags+' | Боты: '+botFrags;}
function addKillfeed(text,player){
  const kf=$('kf'),div=document.createElement('div');
  div.textContent=text;div.style.color=player? '#7ddc4c':'#e5412d';
  kf.appendChild(div);
  if(kf.children.length>5)kf.removeChild(kf.firstChild);
  setTimeout(()=>{div.style.animation='kfIn .2s reverse forwards';setTimeout(()=>div.remove(),200);},3000);
}
function resetGame(){
  P.frags=0;botFrags=0;matchT=180;P.dead=false;P.respT=0;
  bots.forEach(placeBot);
  respawnPlayer();updateScore();$('kf').innerHTML='';
  $('death').classList.add('hide');$('end').classList.add('hide');
}
function endGame(win){
  state='ended';P.firing=false;
  document.exitPointerLock&&document.exitPointerLock();
  $('death').classList.add('hide');
  $('endTitle').textContent=win===null?'Время вышло: ничья':win?'Победа! ('+P.frags+' фрагов)':'Поражение';
  $('endScore').textContent='Ты: '+P.frags+' | Боты: '+botFrags;
  $('end').classList.remove('hide');
}
function tickMatch(dt){
  matchT-=dt;
  const t=Math.max(0,Math.ceil(matchT));
  $('timer').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
  if(matchT<=0)endGame(P.frags>botFrags?true:P.frags<botFrags?false:null);
}

// ===================== ВВОД =====================
function bindInput(){
  const cv=renderer.domElement;
  addEventListener('keydown',e=>{
    keys[e.code]=true;
    if(e.code==='KeyR'&&state==='play')reload();
    if(e.code==='Space')e.preventDefault();
  });
  addEventListener('keyup',e=>keys[e.code]=false);
  addEventListener('contextmenu',e=>e.preventDefault());
  addEventListener('mousedown',e=>{
    if(state!=='play')return;
    if(document.pointerLockElement!==cv){if(!P.dead)cv.requestPointerLock();return;}
    if(e.button===0)P.firing=true;
    if(e.button===2)P.aim=true;
  });
  addEventListener('mouseup',e=>{
    if(e.button===0)P.firing=false;
    if(e.button===2)P.aim=false;
  });
  addEventListener('mousemove',e=>{
    if(document.pointerLockElement!==cv||state!=='play')return;
    const k=P.aim?.0011:.002;
    P.yaw-=e.movementX*k;
    P.pitch=clamp(P.pitch-e.movementY*k,-1.5,1.5);
    P.swY+=e.movementX*.0008;P.swX+=e.movementY*.0008;
  });
  document.addEventListener('pointerlockchange',()=>{
    if(document.pointerLockElement!==cv&&state==='play'&&!P.dead){
      state='paused';P.firing=false;P.aim=false;
      $('bPlay').textContent='Продолжить';$('menu').classList.remove('hide');
    }
  });
}

// ===================== МЕНЮ =====================
function bindUI(){
  $('bPlay').onclick=()=>{
    initAudio();
    $('menu').classList.add('hide');$('hud').style.display='block';
    if(state!=='paused')resetGame();
    state='play';
    renderer.domElement.requestPointerLock();
  };
  $('bSet').onclick=()=>{const s=$('sets');s.style.display=s.style.display==='flex'?'none':'flex';};
  $('vol').oninput=e=>{vol=e.target.value/100;if(master)master.gain.value=vol;};
  $('qual').onchange=e=>{qual=+e.target.value;applyQuality();};
  $('bExit').onclick=()=>{window.close();$('menuMsg').textContent='Игра закрыта. Можно закрыть вкладку.';};
  $('respBtn').onclick=()=>{if(P.dead)respawnPlayer();};
  $('menuBtn').onclick=()=>{state='menu';$('end').classList.add('hide');$('hud').style.display='none';$('bPlay').textContent='Играть';$('menu').classList.remove('hide');};
}
function applyQuality(){
  CFG.shadowRes=[512,1024,2048][qual];
  CFG.ssao=qual>0;CFG.bloom=qual>0;CFG.grain=[.05,.03,.01][qual];
  // Recreate composer
  if(composer){composer.passes.forEach(p=>{if(p.material)p.material.dispose();if(p.uniforms)Object.values(p.uniforms).forEach(u=>{if(u.value&&u.value.dispose)u.value.dispose();});});}
  initPost();
  // Update sun shadows
  scene.traverse(o=>{if(o.isDirectionalLight&&o.castShadow){o.shadow.mapSize.set(CFG.shadowRes,CFG.shadowRes);}});
}

// ===================== ГЛАВНЫЙ ЦИКЛ =====================
let lastFps=60,frameCount=0,fpsTime=0;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05);
  if(state==='play'){
    updatePlayer(dt);updateBots(dt);tickMatch(dt);drawMinimap();updateParts(dt);
  }else{camera.rotation.y+=dt*.12;}
  if(composer)composer.render();else renderer.render(scene,camera);
  // FPS monitor
  frameCount++;fpsTime+=dt;
  if(fpsTime>=1){lastFps=frameCount;frameCount=0;fpsTime=0;
    if(lastFps<45&&qual>0){qual--;$('qual').value=qual;applyQuality();}
  }
}

init();
</script>
