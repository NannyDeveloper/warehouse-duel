<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>WAREHOUSE DUEL</title>
<style>
:root{--ink:#ecebe6;--panel:rgba(16,18,20,.86);--hz:#f2c200;--red:#e5412d;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#ecebe6;--panel:rgba(16,18,20,.86)}}
:root[data-theme="dark"]{--ink:#ecebe6;--panel:rgba(16,18,20,.86)}
html,body{margin:0;height:100%;overflow:hidden;background:#101214;color:var(--ink);font-family:"Arial Narrow",Impact,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--panel);z-index:10;text-align:center;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
.ov.hide{display:none}
h1{font-size:clamp(34px,9vw,72px);letter-spacing:.14em;margin:0 0 6px;font-weight:900}
.stripe{width:min(360px,70vw);height:10px;margin-bottom:18px;background:repeating-linear-gradient(135deg,var(--hz) 0 14px,#16181a 14px 28px)}
button{font:inherit;font-size:20px;letter-spacing:.06em;padding:12px 30px;min-width:230px;border:2px solid var(--hz);background:#16181a;color:var(--ink);cursor:pointer}
button:hover,button:active{background:var(--hz);color:#111}
#sets{display:none;flex-direction:column;gap:8px;align-items:center}
#sets input{width:220px;accent-color:var(--hz)}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
#hurt{position:absolute;inset:0;box-shadow:inset 0 0 120px 30px var(--red);opacity:0}
#score{position:absolute;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:24px;font-weight:700;letter-spacing:.08em;background:rgba(0,0,0,.45);padding:4px 16px}
#cross{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:#fff;box-shadow:0 0 3px #000}
#cross.hit{background:var(--red);transform:scale(2.4)}
#hp{position:absolute;left:20px;bottom:calc(20px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;font-size:34px}
#hpbar{width:180px;height:14px;background:rgba(0,0,0,.55);border:2px solid #000}
#hpfill{display:block;height:100%;width:100%;background:var(--hz)}
#ammo{position:absolute;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));font-size:38px;text-align:right}
#ammo span{font-size:24px;opacity:.7}
#rl{font-size:16px;color:var(--hz);height:18px}
#mob{display:none;position:fixed;inset:0;z-index:6;pointer-events:none}
#mob>*{pointer-events:auto}
#joy{position:absolute;left:calc(24px + env(safe-area-inset-left));bottom:calc(60px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08)}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(242,194,0,.7)}
.tb{position:absolute;min-width:0;width:64px;height:64px;padding:0;border-radius:50%;font-size:16px;background:rgba(16,18,20,.6)}
#bFire{right:24px;bottom:calc(70px + env(safe-area-inset-bottom));width:84px;height:84px;border-color:var(--red)}
#bJump{right:120px;bottom:calc(50px + env(safe-area-inset-bottom))}
#bReload{right:24px;bottom:calc(170px + env(safe-area-inset-bottom))}
#bAim{right:110px;bottom:calc(130px + env(safe-area-inset-bottom))}
body.touch #hp{left:16px;bottom:auto;top:calc(12px + env(safe-area-inset-top));font-size:24px}
body.touch #hpbar{width:100px}
body.touch #ammo{right:16px;bottom:auto;top:calc(8px + env(safe-area-inset-top));font-size:26px}
#hud { font-family: 'Impact', 'Arial Black', sans-serif; }
#score { font-size: 20px; color: #fff; background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 4px; top: 20px; position: absolute; left: 50%; transform: translateX(-50%); }
</style>
</head>
<body>

<div id="menu" class="ov">
  <h1>WAREHOUSE DUEL</h1><div class="stripe"></div>
  <button id="bPlay">Играть</button>
  <button id="bSet">Настройки</button>
  <div id="sets"><label for="vol">Громкость</label><input id="vol" type="range" min="0" max="100" value="50"></div>
  <button id="bExit">Выход</button>
  <div id="menuMsg"></div>
</div>

<div id="death" class="ov hide"><h1>Ты убит</h1><button id="respBtn">Возродиться (3)</button></div>
<div id="end" class="ov hide"><h1 id="endTitle">Победа!</h1><div id="endScore"></div><button id="menuBtn">В меню</button></div>

<div id="hud">
  <div id="hurt"></div>
  <div id="score">Ты: 0 | Боты: 0</div>
  <div id="cross" style="position:absolute; left:50%; top:50%; width:4px; height:4px; background:lime; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 4px #000;"></div>
  
  <div style="position:absolute; left:20px; bottom:20px; display:flex; align-items:center; gap:10px;">
    <div style="color:#fff; font-size:32px; font-weight:bold; text-shadow:2px 2px 0 #000;" id="hpnum">100</div>
    <div style="width:200px; height:12px; background:rgba(0,0,0,0.5); border:2px solid #fff; border-radius:2px;">
      <div id="hpfill" style="height:100%; width:100%; background:#00ff00; transition:width 0.2s;"></div>
    </div>
  </div>

  <div style="position:absolute; right:20px; bottom:20px; text-align:right; color:#fff; text-shadow:2px 2px 0 #000;">
    <div style="font-size:48px; font-weight:900; line-height:1;"><span id="am">30</span> <span style="font-size:24px; color:#aaa;">/ <span id="rs">90</span></span></div>
    <div id="rl" style="font-size:18px; color:#ff3333; font-weight:bold; height:20px;"></div>
  </div>
</div>

<div id="mob">
  <div id="joy"><div id="knob"></div></div>
  <button class="tb" id="bFire">ОГОНЬ</button>
  <button class="tb" id="bJump">Прыж</button>
  <button class="tb" id="bReload">R</button>
  <button class="tb" id="bAim">Прицел</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===================== КОНСТАНТЫ И СОСТОЯНИЕ =====================
const $ = id => document.getElementById(id);
const HALF = 20;          // половина арены (комната 40x40)
const WIN = 10;           // фрагов до победы
const MAG = 30;           // размер магазина
const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

let scene, camera, renderer, clock, gun, flash;
let state = 'menu';       // menu | play | paused | ended
let botFrags = 0, hurtA = 0, vol = 0.5, actx, master;
const crates = [], crateMeshes = [], wallMeshes = [], bots = [];
const keys = {};
const rc = new THREE.Raycaster();
const mv = { x: 0, y: 0, run: false };   // джойстик

// Состояние игрока
const P = {
  pos: new THREE.Vector3(0, 1.7, 14), vy: 0, yaw: 0, pitch: 0,
  hp: 100, dead: false, respT: 0, frags: 0,
  ammo: MAG, reserve: 90, reloading: false, reloadT: 0,
  last: 0, firing: false, aim: false, jumpReq: false, kick: 0, flashT: 0
};

// ===================== ИНИЦИАЛИЗАЦИЯ =====================
function init() {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.body.prepend(renderer.domElement);
  camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.05, 100);
  camera.rotation.order = 'YXZ';
  clock = new THREE.Clock();
  setupScene();
  for (let i = 0; i < 4; i++) makeBot();
  bindInput();
  bindUI();
  if (isTouch) { document.body.classList.add('touch'); $('mob').style.display = 'block'; }
  addEventListener('resize', () => {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  });
  camera.position.copy(P.pos);
  loop();
}

// ===================== СЦЕНА =====================
function setupScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0b0e);
  scene.fog = new THREE.FogExp2(0x0a0b0e, 0.02);

  scene.add(new THREE.AmbientLight(0x404050, 0.7));

  const spot = new THREE.SpotLight(0xffeebb, 1.5, 60, Math.PI / 3, 0.5, 1);
  spot.position.set(0, 15, 0);
  spot.castShadow = true;
  spot.shadow.mapSize.width = 1024;
  spot.shadow.mapSize.height = 1024;
  scene.add(spot);

  const pl1 = new THREE.PointLight(0xffaa55, 0.8, 20);
  pl1.position.set(-15, 5, -15); scene.add(pl1);
  const pl2 = new THREE.PointLight(0xffaa55, 0.8, 20);
  pl2.position.set(15, 5, 15); scene.add(pl2);

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(HALF * 2, HALF * 2), new THREE.MeshLambertMaterial({ color: 0x555a60 }));
  floor.rotation.x = -Math.PI / 2; 
  floor.receiveShadow = true;
  scene.add(floor);

  const grid = new THREE.GridHelper(HALF * 2, 20, 0x2d3136, 0x6b7077); 
  grid.position.y = 0.01; 
  scene.add(grid);

  const wm = new THREE.MeshLambertMaterial({ color: 0x8b8f94 });
  [[0, -HALF - 0.5, 40, 1], [0, HALF + 0.5, 40, 1], [-HALF - 0.5, 0, 1, 40], [HALF + 0.5, 0, 1, 40]].forEach(([x, z, w, d]) => {
    const w1 = new THREE.Mesh(new THREE.BoxGeometry(w, 6, d), wm);
    w1.position.set(x, 3, z); 
    w1.receiveShadow = true;
    w1.castShadow = true;
    scene.add(w1); 
    wallMeshes.push(w1);
  });

  const cm = new THREE.MeshLambertMaterial({ color: 0x9a7640 });
  const em = new THREE.LineBasicMaterial({ color: 0x3b2a12 });
  [[-10, -10], [10, -10], [-10, 10], [10, 10], [0, 0], [-14, 0], [14, 0], [0, -14], [0, 14]].forEach(([x, z]) => {
    const c = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 3), cm);
    c.position.set(x, 1.5, z);
    c.castShadow = true;
    c.receiveShadow = true;
    c.add(new THREE.LineSegments(new THREE.EdgesGeometry(c.geometry), em));
    scene.add(c); 
    crateMeshes.push(c); 
    crates.push({ x, z });
  });

  scene.add(camera);
  
  gun = new THREE.Group();
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.5, 8), new THREE.MeshLambertMaterial({color: 0x111111}));
  barrel.rotation.x = Math.PI / 2; 
  barrel.position.z = -0.2;
  gun.add(barrel);
  
  const stock = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.15, 0.3), new THREE.MeshLambertMaterial({color: 0x2a1f18}));
  stock.position.set(0, -0.05, 0.1);
  gun.add(stock);
  
  const mag = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.15, 0.1), new THREE.MeshLambertMaterial({color: 0x1a1a1a}));
  mag.position.set(0, -0.15, -0.05);
  gun.add(mag);
  
  flash = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.08), new THREE.MeshBasicMaterial({ color: 0xffd24a }));
  flash.position.z = -0.6; 
  flash.visible = false; 
  gun.add(flash);
  
  gun.position.set(0.25, -0.22, -0.5);
  camera.add(gun);
}

// ===================== ЗВУК (синтез через AudioContext) =====================
function audio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.connect(actx.destination);
  }
  master.gain.value = vol;
  if (actx.state === 'suspended') actx.resume();
}
function noise(dur, freq, g) {
  const n = actx.sampleRate * dur | 0, b = actx.createBuffer(1, n, actx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = actx.createBufferSource(); s.buffer = b;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const gn = actx.createGain(); gn.gain.value = g;
  s.connect(f); f.connect(gn); gn.connect(master); s.start();
}
function tone(f0, f1, dur, g, type) {
  const t = actx.currentTime, o = actx.createOscillator(), gn = actx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  gn.gain.setValueAtTime(g, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(gn); gn.connect(master); o.start(); o.stop(t + dur);
}
const sfx = {
  shot()  { if (!actx) return; noise(0.12, 2600, 0.8); tone(160, 40, 0.12, 0.6, 'square'); },
  bot(v)  { if (!actx || v <= 0) return; noise(0.1, 1500, 0.3 * v); },
  hit(h)  { if (!actx) return; tone(h ? 1500 : 800, h ? 2200 : 1100, 0.09, 0.4, 'sine'); },
  hurt()  { if (!actx) return; tone(220, 90, 0.15, 0.4, 'sawtooth'); },
  reload() {
    if (!actx) return;
    [0, 450, 1300].forEach(ms => setTimeout(() => { if (actx) { noise(0.04, 5000, 0.5); tone(400, 200, 0.05, 0.3, 'square'); } }, ms));
  }
};

// ===================== КОЛЛИЗИИ =====================
// Выталкивает круг радиуса r из стен арены и ящиков (в плоскости XZ)
function collide(p, r) {
  p.x = Math.max(-HALF + r, Math.min(HALF - r, p.x));
  p.z = Math.max(-HALF + r, Math.min(HALF - r, p.z));
  for (const c of crates) {
    const nx = Math.max(c.x - 1.5, Math.min(c.x + 1.5, p.x));
    const nz = Math.max(c.z - 1.5, Math.min(c.z + 1.5, p.z));
    const dx = p.x - nx, dz = p.z - nz, d = Math.hypot(dx, dz);
    if (d < r) {
      if (d > 1e-4) { p.x += dx / d * (r - d); p.z += dz / d * (r - d); }
      else {
        const ox = 1.5 - Math.abs(p.x - c.x), oz = 1.5 - Math.abs(p.z - c.z);
        if (ox < oz) p.x += (p.x >= c.x ? 1 : -1) * (ox + r);
        else p.z += (p.z >= c.z ? 1 : -1) * (oz + r);
      }
    }
  }
}
// Случайная точка арены вне ящиков (и подальше от заданной точки)
function randomPoint(away, minD) {
  for (let i = 0; i < 60; i++) {
    const x = (Math.random() * 2 - 1) * (HALF - 2), z = (Math.random() * 2 - 1) * (HALF - 2);
    if (crates.some(c => Math.abs(x - c.x) < 2.5 && Math.abs(z - c.z) < 2.5)) continue;
    if (away && Math.hypot(x - away.x, z - away.z) < minD) continue;
    return { x, z };
  }
  return { x: 0, z: -17 };
}

// ===================== ИГРОК =====================
function updatePlayer(dt) {
  if (P.dead) {                       // таймер респавна
    P.respT -= dt;
    $('respBtn').textContent = 'Возродиться (' + Math.max(0, Math.ceil(P.respT)) + ')';
    if (P.respT <= 0) respawnPlayer();
    camera.position.y = Math.max(0.35, camera.position.y - dt * 2);
    return;
  }
  // Движение
  const run = keys.ShiftLeft || keys.ShiftRight || mv.run;
  const sp = run ? 8 : 5;
  let fx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + mv.x;
  let fz = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0) + mv.y;
  const l = Math.hypot(fx, fz); if (l > 1) { fx /= l; fz /= l; }
  const s = Math.sin(P.yaw), c = Math.cos(P.yaw);
  P.pos.x += (fx * c + fz * s) * sp * dt;
  P.pos.z += (-fx * s + fz * c) * sp * dt;
  collide(P.pos, 0.4);
  // Прыжок
  if ((keys.Space || P.jumpReq) && P.pos.y <= 1.701) P.vy = 7;
  P.vy -= 20 * dt; P.pos.y += P.vy * dt;
  if (P.pos.y < 1.7) { P.pos.y = 1.7; P.vy = 0; }
  // Прицеливание: FOV сужается
  const tf = P.aim ? 42 : 75;
  if (Math.abs(camera.fov - tf) > 0.1) { camera.fov += (tf - camera.fov) * Math.min(1, dt * 14); camera.updateProjectionMatrix(); }
  // Перезарядка
  if (P.reloading) {
    P.reloadT -= dt;
    if (P.reloadT <= 0) {
      const take = Math.min(MAG - P.ammo, P.reserve);
      P.ammo += take; P.reserve -= take; P.reloading = false; updateHUD();
    }
  }
  if (P.firing) shoot();
  // Камера и оружие
  camera.position.copy(P.pos);
  camera.rotation.set(P.pitch, P.yaw, 0);
  P.kick *= Math.max(0, 1 - dt * 14);
  gun.position.set(P.aim ? 0.0 : 0.25, P.aim ? -0.17 : -0.22, -0.5 + P.kick);
  gun.rotation.x = P.reloading ? -0.6 : 0;
  if (P.flashT > 0) { P.flashT -= dt; if (P.flashT <= 0) flash.visible = false; }
  hurtA = Math.max(0, hurtA - dt * 1.5); $('hurt').style.opacity = hurtA;
}

function shoot() {
  const now = performance.now() / 1000;
  if (P.dead || P.reloading || now - P.last < 0.1) return;   // автомат: 10 выстрелов/сек
  if (P.ammo <= 0) { reload(); return; }
  P.last = now; P.ammo--;
  sfx.shot();
  // Отдача: ствол вверх + лёгкий увод в сторону
  P.pitch = Math.min(1.5, P.pitch + 0.014); P.yaw += (Math.random() - 0.5) * 0.006;
  P.kick = 0.07; flash.visible = true; P.flashT = 0.04;
  // Raycaster из центра экрана
  camera.updateMatrixWorld();
  rc.setFromCamera({ x: 0, y: 0 }, camera); rc.far = 100;
  const targets = crateMeshes.concat(wallMeshes, bots.filter(b => !b.dead).map(b => b.mesh));
  const hit = rc.intersectObjects(targets, true)[0]; 
  
  if (hit) {
    let botObj = hit.object;
    while (botObj && !botObj.userData.bot) {
      botObj = botObj.parent;
    }
    
    if (botObj && botObj.userData.bot) {
      const localY = hit.point.y - (botObj.position.y - 1);
      damageBot(botObj.userData.bot, localY >= 4 / 3);
    }
  }
  updateHUD();
  if (P.ammo === 0) reload();
}

function reload() {
  if (P.reloading || P.dead || P.ammo >= MAG || P.reserve <= 0) return;
  P.reloading = true; P.reloadT = 1.5; sfx.reload(); updateHUD();
}

function hurtPlayer(d) {
  if (P.dead) return;
  P.hp = Math.max(0, P.hp - d); hurtA = 0.7; sfx.hurt(); updateHUD();
  if (P.hp <= 0) {
    P.dead = true; P.respT = 3; P.firing = false; botFrags++; updateScore();
    if (botFrags >= WIN) { endGame(false); return; }
    $('death').classList.remove('hide');
    document.exitPointerLock && document.exitPointerLock();   // чтобы можно было нажать кнопку
  }
}

function respawnPlayer() {
  const alive = bots.find(b => !b.dead);
  const p = randomPoint(alive ? alive.mesh.position : null, 10);
  P.pos.set(p.x, 1.7, p.z); P.vy = 0; P.pitch = 0; P.yaw = Math.random() * 6.28;
  P.hp = 100; P.ammo = MAG; P.reserve = 90; P.reloading = false; P.dead = false;
  $('death').classList.add('hide'); updateHUD();
  if (!isTouch && state === 'play') { try { renderer.domElement.requestPointerLock(); } catch (e) {} }
}

// ===================== БОТЫ =====================
function makeBot() {
  const botGroup = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 0.8), new THREE.MeshLambertMaterial({color: 0x881111}));
  body.position.y = 0.75; 
  body.castShadow = true;
  botGroup.add(body);
  
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshLambertMaterial({color: 0xaa2222}));
  head.position.y = 1.8; 
  head.castShadow = true;
  botGroup.add(head);
  
  const visor = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.1, 0.05), new THREE.MeshBasicMaterial({color: 0xff0000}));
  visor.position.set(0, 1.8, 0.35); 
  botGroup.add(visor);
  
  const b = { mesh: botGroup, hp: 100, dead: false, state: 'patrol', target: null, react: 0, shootT: 0, hideT: 0, coverCd: 0, respT: 0, stuck: 0, sees: false, cover: null };
  botGroup.userData.bot = b; 
  scene.add(botGroup); 
  bots.push(b);
  placeBot(b);
}
function placeBot(b) {
  const p = randomPoint(P.pos, 10);
  b.mesh.position.set(p.x, 1, p.z); b.mesh.visible = true;
  b.hp = 100; b.dead = false; b.state = 'patrol'; b.sees = false; b.coverCd = 0;
  pickTarget(b);
}
function pickTarget(b) { b.target = randomPoint(); b.stuck = 0; }

function nearestCrate(p) {
  let best = crates[0], bd = 1e9;
  for (const c of crates) { const d = Math.hypot(c.x - p.x, c.z - p.z); if (d < bd) { bd = d; best = c; } }
  return best;
}
// Перемещение бота к точке с коллизиями
function moveBot(b, tx, tz, speed, dt) {
  const m = b.mesh.position, dx = tx - m.x, dz = tz - m.z, d = Math.hypot(dx, dz);
  if (d < 0.05) return;
  const ox = m.x, oz = m.z, st = Math.min(d, speed * dt);
  m.x += dx / d * st; m.z += dz / d * st;
  collide(m, 0.55);
  b.mesh.rotation.y = Math.atan2(dx, dz);
  b.stuck = Math.hypot(m.x - ox, m.z - oz) < st * 0.3 ? b.stuck + dt : 0;
}
// Есть ли прямая видимость до игрока (ящики не мешают)
function clearLOS(b, dist) {
  const m = b.mesh.position, o = new THREE.Vector3(m.x, 1.5, m.z);
  const dir = P.pos.clone().sub(o).normalize();
  rc.set(o, dir); rc.far = dist;
  return rc.intersectObjects(crateMeshes, false).length === 0;
}
// Выстрел бота: луч в игрока со случайным разбросом
function botShoot(b, dist) {
  const m = b.mesh.position, o = new THREE.Vector3(m.x, 1.5, m.z);
  const tgt = P.pos.clone(); tgt.y -= 0.4;
  const dir = tgt.clone().sub(o).normalize();
  dir.x += (Math.random() - 0.5) * 0.12; dir.y += (Math.random() - 0.5) * 0.12; dir.z += (Math.random() - 0.5) * 0.12;
  dir.normalize();
  sfx.bot(1 - dist / 25);
  const w = tgt.clone().sub(o), t = w.dot(dir);
  const closest = w.sub(dir.clone().multiplyScalar(t)).length();
  if (t > 0 && closest < 0.55) hurtPlayer(15);
}

function updateBots(dt) {
  for (const b of bots) {
    if (b.dead) { b.respT -= dt; if (b.respT <= 0) placeBot(b); continue; }   // респавн через 5 сек
    const m = b.mesh.position;
    b.coverCd -= dt;
    const dx = P.pos.x - m.x, dz = P.pos.z - m.z, dist = Math.hypot(dx, dz);

    // Укрытие: HP < 30 → бежим к ближайшему ящику и прячемся за ним 3 сек
    if (b.hp < 30 && b.state !== 'cover' && b.coverCd <= 0) {
      b.state = 'cover'; b.cover = nearestCrate(m); b.hideT = 0; b.sees = false;
    }
    if (b.state === 'cover') {
      const c = b.cover, ux = c.x - P.pos.x, uz = c.z - P.pos.z, l = Math.hypot(ux, uz) || 1;
      const hx = c.x + ux / l * 2.4, hz = c.z + uz / l * 2.4;      // точка за ящиком (с противоположной от игрока стороны)
      moveBot(b, hx, hz, 5, dt);
      if (Math.hypot(hx - m.x, hz - m.z) < 0.9) b.hideT += dt;
      if (b.hideT >= 3) { b.state = 'patrol'; b.coverCd = 8; pickTarget(b); }
      continue;
    }

    // Обнаружение: FOV 90° (cos 45° ≈ 0.707), дистанция < 20, прямая видимость
    let sees = false;
    if (!P.dead && dist < 20 && dist > 0.01) {
      const r = b.mesh.rotation.y, dot = (Math.sin(r) * dx + Math.cos(r) * dz) / dist;
      sees = dot > 0.7071 && clearLOS(b, dist);
    }
    if (sees) {
      b.mesh.rotation.y = Math.atan2(dx, dz);            // остановился и целится
      if (!b.sees) { b.react = 0.4; b.shootT = 0; }      // реакция 0.4 сек
      b.sees = true;
      if (b.react > 0) b.react -= dt;
      else { b.shootT -= dt; if (b.shootT <= 0) { b.shootT = 0.3; botShoot(b, dist); } }   // раз в 0.3 сек
    } else {
      b.sees = false;                                    // патрулирование
      moveBot(b, b.target.x, b.target.z, 2.5, dt);
      if (Math.hypot(b.target.x - m.x, b.target.z - m.z) < 1 || b.stuck > 1.5) pickTarget(b);
    }
  }
}

function damageBot(b, head) {
  b.hp -= head ? 100 : 25;                                // голова — 100, тело — 25
  sfx.hit(head); hitMarker();
  b.mesh.rotation.y = Math.atan2(P.pos.x - b.mesh.position.x, P.pos.z - b.mesh.position.z);
  if (b.hp <= 0) {
    b.dead = true; b.mesh.visible = false; b.respT = 5; b.sees = false;
    P.frags++; P.reserve += 30; updateScore(); updateHUD();
    if (P.frags >= WIN) endGame(true);
  }
}

// ===================== HUD И ЭКРАНЫ =====================
function hitMarker() {
  const c = $('cross'); c.classList.add('hit');
  setTimeout(() => c.classList.remove('hit'), 120);
}
function updateHUD() {
  $('hpnum').textContent = P.hp; $('hpfill').style.width = P.hp + '%';
  $('am').textContent = P.ammo; $('rs').textContent = P.reserve;
  $('rl').textContent = P.reloading ? 'ПЕРЕЗАРЯДКА…' : '';
}
function updateScore() { $('score').textContent = 'Ты: ' + P.frags + ' | Боты: ' + botFrags; }

function resetGame() {
  P.frags = 0; botFrags = 0; P.dead = false; P.respT = 0;
  bots.forEach(placeBot);
  respawnPlayer(); updateScore();
  $('death').classList.add('hide'); $('end').classList.add('hide');
}
function endGame(win) {
  state = 'ended'; P.firing = false;
  document.exitPointerLock && document.exitPointerLock();
  $('death').classList.add('hide');
  $('endTitle').textContent = win ? 'Победа! (' + WIN + ' фрагов)' : 'Поражение';
  $('endScore').textContent = 'Ты: ' + P.frags + ' | Боты: ' + botFrags;
  $('end').classList.remove('hide');
}

// ===================== ВВОД =====================
function bindInput() {
  const cv = renderer.domElement;
  addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'KeyR' && state === 'play') reload();
    if (e.code === 'Space') e.preventDefault();
  });
  addEventListener('keyup', e => keys[e.code] = false);
  addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('mousedown', e => {
    if (state !== 'play' || isTouch) return;
    if (document.pointerLockElement !== cv) { if (!P.dead) cv.requestPointerLock(); return; }   // клик возвращает захват мыши
    if (e.button === 0) P.firing = true;
    if (e.button === 2) P.aim = true;
  });
  addEventListener('mouseup', e => {
    if (e.button === 0) P.firing = false;
    if (e.button === 2) P.aim = false;
  });
  addEventListener('mousemove', e => {
    if (document.pointerLockElement !== cv || state !== 'play') return;
    const k = P.aim ? 0.0011 : 0.002;
    P.yaw -= e.movementX * k;
    P.pitch = Math.max(-1.5, Math.min(1.5, P.pitch - e.movementY * k));
  });
  document.addEventListener('pointerlockchange', () => {
    if (document.pointerLockElement !== cv && state === 'play' && !P.dead && !isTouch) {
      state = 'paused'; P.firing = false; P.aim = false;
      $('bPlay').textContent = 'Продолжить'; $('menu').classList.remove('hide');
    }
  });
  if (isTouch) bindTouch();
}

// Мобильное управление: левый джойстик, правая половина — обзор, кнопки
function bindTouch() {
  const joy = $('joy'), knob = $('knob');
  let jid = null, jc = { x: 0, y: 0 }, lid = null, lp = { x: 0, y: 0 };
  const setJoy = t => {
    let dx = t.clientX - jc.x, dy = t.clientY - jc.y;
    const d = Math.hypot(dx, dy), R = 50;
    if (d > R) { dx = dx / d * R; dy = dy / d * R; }
    knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    mv.x = dx / R; mv.y = dy / R; mv.run = d > R * 1.15;
  };
  document.addEventListener('touchstart', e => {
    if (state !== 'play') return;
    for (const t of e.changedTouches) {
      const el = document.elementFromPoint(t.clientX, t.clientY);
      if (!el || el.closest('.tb')) continue;
      if (el.closest('#joy') && jid === null) {
        jid = t.identifier; const r = joy.getBoundingClientRect();
        jc = { x: r.left + r.width / 2, y: r.top + r.height / 2 }; setJoy(t);
      } else if (t.clientX > innerWidth / 2 && lid === null) {
        lid = t.identifier; lp = { x: t.clientX, y: t.clientY };
      }
    }
  }, { passive: false });
  document.addEventListener('touchmove', e => {
    if (state === 'play') e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === jid) setJoy(t);
      else if (t.identifier === lid) {
        const k = P.aim ? 0.0025 : 0.0045;
        P.yaw -= (t.clientX - lp.x) * k;
        P.pitch = Math.max(-1.5, Math.min(1.5, P.pitch - (t.clientY - lp.y) * k));
        lp = { x: t.clientX, y: t.clientY };
      }
    }
  }, { passive: false });
  const end = e => {
    for (const t of e.changedTouches) {
      if (t.identifier === jid) { jid = null; mv.x = mv.y = 0; mv.run = false; knob.style.transform = ''; }
      if (t.identifier === lid) lid = null;
    }
  };
  document.addEventListener('touchend', end); document.addEventListener('touchcancel', end);
  const hold = (id, on, off) => {
    const el = $(id);
    el.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); on(); }, { passive: false });
    el.addEventListener('touchend', e => { e.preventDefault(); if (off) off(); }, { passive: false });
  };
  hold('bFire', () => P.firing = true, () => P.firing = false);
  hold('bJump', () => P.jumpReq = true, () => P.jumpReq = false);
  hold('bReload', reload);
  hold('bAim', () => P.aim = !P.aim);
}

// ===================== МЕНЮ =====================
function bindUI() {
  $('bPlay').onclick = () => {
    audio();
    $('menu').classList.add('hide'); $('hud').style.display = 'block';
    if (state !== 'paused') resetGame();
    state = 'play';
    if (!isTouch) renderer.domElement.requestPointerLock();
  };
  $('bSet').onclick = () => { const s = $('sets'); s.style.display = s.style.display === 'flex' ? 'none' : 'flex'; };
  $('vol').oninput = e => { vol = e.target.value / 100; if (master) master.gain.value = vol; };
  $('bExit').onclick = () => {
    window.close();
    $('menuMsg').textContent = 'Игра закрыта. Можно закрыть вкладку.';
  };
  $('respBtn').onclick = () => { if (P.dead) respawnPlayer(); };
  $('menuBtn').onclick = () => {
    state = 'menu'; $('end').classList.add('hide'); $('hud').style.display = 'none';
    $('bPlay').textContent = 'Играть'; $('menu').classList.remove('hide');
  };
}

// ===================== ГЛАВНЫЙ ЦИКЛ =====================
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (state === 'play') { updatePlayer(dt); updateBots(dt); }
  else camera.rotation.y += dt * 0.12;                    // медленное вращение камеры в меню
  renderer.render(scene, camera);
}

init();
</script>
</body>
